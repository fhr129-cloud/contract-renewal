<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FS 사업장 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
window.kakaoReady = false;
function loadKakao() {
  var script = document.createElement('script');
  script.src = '//dapi.kakao.com/v2/maps/sdk.js?appkey=aefff94dbfce9edffe1c0e100dc4de55&libraries=services&autoload=false';
  script.onload = function() {
    kakao.maps.load(function(){ window.kakaoReady = true; });
  };
  document.head.appendChild(script);
}
window.addEventListener('load', loadKakao);
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:#f0f0ee;color:#1a1a18;min-height:100vh;font-size:14px;}

#home-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;}
.home-logo{font-size:28px;font-weight:700;color:#185FA5;margin-bottom:4px;}
.home-sub{font-size:13px;color:#aaa;margin-bottom:40px;}
.home-menu{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:440px;}
.home-btn{background:#fff;border:.5px solid #e8e8e4;border-radius:14px;padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:box-shadow .15s,transform .15s;text-align:center;}
.home-btn:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);transform:translateY(-2px);}
.home-btn i{font-size:30px;}
.home-btn .lbl{font-size:14px;font-weight:600;}
.home-btn .desc{font-size:11px;color:#999;}
.home-btn.blue i{color:#185FA5;}.home-btn.green i{color:#3B6D11;}
.home-btn.amber i{color:#854F0B;}.home-btn.red i{color:#A32D2D;}

#app{display:none;flex-direction:column;min-height:100vh;max-width:1280px;margin:0 auto;width:100%;background:#f0f0ee;}
#detail-screen{display:none;flex-direction:column;min-height:100vh;max-width:1280px;margin:0 auto;width:100%;background:#f0f0ee;}
.top-bar{height:52px;background:#fff;border-bottom:.5px solid #e8e8e4;display:flex;align-items:center;padding:0 18px;gap:10px;position:sticky;top:0;z-index:200;}
.back-btn{display:flex;align-items:center;gap:5px;font-size:13px;color:#185FA5;background:none;border:none;cursor:pointer;padding:0;white-space:nowrap;font-family:inherit;}
.top-bar h2{font-size:15px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.top-actions{display:flex;gap:7px;flex-shrink:0;}
.page-body{padding:20px 24px;}

.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:8px;border:.5px solid #ccc;background:#fff;font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit;}
.btn:hover{background:#f5f5f3;}
.btn.primary{background:#185FA5;color:#fff;border-color:#185FA5;}
.btn.primary:hover{background:#0C447C;}
.btn.danger{background:#FCEBEB;color:#A32D2D;border-color:#F7C1C1;}
.btn.sm{padding:4px 9px;font-size:12px;}

.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:500;padding:3px 8px;border-radius:99px;border:.5px solid transparent;white-space:nowrap;}
.badge.urgent{background:#FCEBEB;color:#A32D2D;border-color:#F7C1C1;}
.badge.near{background:#FAEEDA;color:#854F0B;border-color:#FAC775;}
.badge.ok{background:#EAF3DE;color:#3B6D11;border-color:#C0DD97;}
.badge.auto{background:#E6F1FB;color:#185FA5;border-color:#B5D4F4;}
.badge-cat{font-size:11px;font-weight:500;padding:2px 8px;border-radius:99px;background:#f0f0ec;color:#555;white-space:nowrap;flex-shrink:0;}

/* 대시보드 */
.stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px;}
.stat-card{background:#fff;border:.5px solid #e8e8e4;border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:box-shadow .12s;min-width:0;}
.stat-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.08);}
.stat-card.active-card{box-shadow:0 0 0 2px #185FA5;}
.stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.stat-icon.blue,.stat-icon.blue2{background:#E6F1FB;color:#185FA5;}
.stat-icon.red{background:#FCEBEB;color:#A32D2D;}
.stat-icon.amber{background:#FAEEDA;color:#854F0B;}
.stat-icon.green{background:#EAF3DE;color:#3B6D11;}
.stat-info{min-width:0;}
.stat-info .stat-label{font-size:11px;color:#888;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stat-val{font-size:22px;font-weight:600;}
.stat-val.blue,.stat-val.blue2{color:#185FA5;}
.stat-val.red{color:#A32D2D;}
.stat-val.amber{color:#854F0B;}
.stat-val.green{color:#3B6D11;}
.dash-list-wrap{background:#fff;border:.5px solid #e8e8e4;border-radius:12px;overflow:hidden;margin-bottom:14px;}
.dash-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:.5px solid #f0f0ec;cursor:pointer;gap:8px;}
.dash-item:last-child{border-bottom:none;}
.dash-item:hover{background:#fafaf8;}
.dash-name{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dash-sub{font-size:12px;color:#888;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dash-left{min-width:0;flex:1;}
.dash-right{text-align:right;flex-shrink:0;}
.dash-dday{font-size:12px;font-weight:500;margin-top:4px;white-space:nowrap;}

/* 달력 */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:#e8e8e4;border-radius:10px;overflow:hidden;}
.cal-header{background:#f5f5f3;text-align:center;font-size:12px;font-weight:500;color:#888;padding:8px 0;}
.cal-day{background:#fff;min-height:80px;padding:4px 3px;cursor:pointer;}
.cal-day:hover{background:#fafaf8;}
.cal-day.empty{background:#fafaf8;cursor:default;}
.cal-day.today .cal-num{background:#185FA5;color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;}
.cal-num{font-size:11px;font-weight:500;margin-bottom:2px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;}
.cal-event{font-size:9px;padding:1px 3px;border-radius:3px;margin-bottom:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.5;}
.cal-event.cat-0{background:#E6F1FB;color:#185FA5;}
.cal-event.cat-1{background:#EAF3DE;color:#3B6D11;}
.cal-event.cat-2{background:#FAEEDA;color:#854F0B;}
.cal-event.cat-3{background:#FCEBEB;color:#A32D2D;}
.cal-event.cat-4{background:#F3E6FB;color:#6B2FA0;}
.cal-event.cat-5{background:#f0f0ec;color:#555;}
.cal-more{font-size:9px;color:#aaa;padding:1px 3px;}

/* 달력 팝업 */
.cal-popup{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:400;align-items:center;justify-content:center;}
.cal-popup.open{display:flex;}
.cal-popup-inner{background:#fff;border-radius:14px;width:420px;max-width:95vw;max-height:80vh;overflow-y:auto;}
.cal-popup-header{padding:14px 18px;border-bottom:.5px solid #e8e8e4;display:flex;align-items:center;justify-content:space-between;}
.cal-popup-header h4{font-size:14px;font-weight:600;}
.cal-popup-body{padding:14px 18px;}
.cal-sup-item{padding:10px 0;border-bottom:.5px solid #f0f0ec;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.cal-sup-item:last-child{border-bottom:none;}

/* 운영지원 폼 */
.sup-form-group{display:flex;flex-direction:column;gap:4px;}
.sup-form-group label{font-size:12px;color:#666;font-weight:500;}
.sup-form-group input,.sup-form-group select{padding:8px 10px;border:.5px solid #ccc;border-radius:8px;font-size:13px;font-family:inherit;width:100%;}
.searchable-select{position:relative;}
.ss-dropdown{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:.5px solid #ccc;border-radius:8px;max-height:200px;overflow-y:auto;z-index:100;box-shadow:0 4px 16px rgba(0,0,0,.1);}
.ss-dropdown.open{display:block;}
.ss-option{padding:8px 12px;font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ss-option:hover{background:#f0f0ee;}
.sup-row{display:flex;align-items:center;gap:6px;padding:9px 0;border-bottom:.5px solid #f0f0ec;font-size:13px;min-width:0;}
.sup-row:last-child{border-bottom:none;}
.sup-biz{font-weight:500;cursor:pointer;color:#185FA5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
.sup-meta{font-size:11px;color:#888;white-space:nowrap;flex-shrink:0;}
.sup-staff-str{font-size:11px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px;}
.sup-content-str{font-size:12px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}

/* 운영끼니 */
.meal-select-wrap{border:.5px solid #ccc;border-radius:8px;overflow:hidden;}
.meal-day-section{border-bottom:.5px solid #f0f0ec;}
.meal-day-section:last-child{border-bottom:none;}
.meal-day-header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fafaf8;}
.meal-day-label{font-size:12px;font-weight:600;color:#444;min-width:44px;}
.meal-chips{display:flex;gap:6px;flex-wrap:wrap;padding:6px 12px 10px;}
.meal-chip{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border:.5px solid #ddd;border-radius:99px;font-size:12px;cursor:pointer;background:#fff;transition:all .1s;user-select:none;white-space:nowrap;}
.meal-chip:hover{border-color:#185FA5;color:#185FA5;}
.meal-chip input{display:none;}
.meal-chip.checked{background:#185FA5;color:#fff;border-color:#185FA5;}

/* 담당자/지원자 */
.contact-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px;}
.contact-row input{padding:7px 10px;border:.5px solid #ccc;border-radius:8px;font-size:13px;font-family:inherit;width:100%;}

/* FS 사업장 현황 */
.tab-bar{display:flex;gap:4px;border-bottom:.5px solid #e8e8e4;margin-bottom:16px;}
.tab-btn{padding:8px 16px;font-size:13px;font-weight:500;color:#888;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px;font-family:inherit;white-space:nowrap;}
.tab-btn.active{color:#185FA5;border-bottom-color:#185FA5;}
.team-layout{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.resp-layout{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.team-header{font-size:13px;font-weight:600;color:#fff;padding:10px 14px;border-radius:8px;margin-bottom:0;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;}
.team-header.blue{background:#185FA5;}.team-header.green{background:#3B6D11;}
.team-header.amber{background:#854F0B;}.team-header.red{background:#A32D2D;}
.team-header span{font-size:12px;font-weight:400;margin-left:auto;flex-shrink:0;}
.team-header .toggle-icon{font-size:14px;transition:transform .2s;margin-left:4px;flex-shrink:0;}
.team-body{display:none;padding-top:8px;}
.team-body.open{display:block;}
.biz-card{background:#fff;border:.5px solid #e8e8e4;border-radius:10px;padding:12px;cursor:pointer;transition:box-shadow .12s;margin-bottom:8px;}
.biz-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.08);}
.biz-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:6px;}
.biz-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.biz-info{font-size:11px;color:#888;display:flex;flex-direction:column;gap:2px;margin-bottom:6px;}
.biz-info span{display:flex;align-items:center;gap:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.biz-info i{flex-shrink:0;font-size:11px;}
.biz-bottom{display:flex;justify-content:space-between;font-size:11px;color:#aaa;border-top:.5px solid #f0f0ec;padding-top:6px;gap:4px;}
.biz-bottom span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#map{height:500px;border-radius:12px;border:.5px solid #e8e8e4;}
.map-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#666;margin-bottom:10px;}
.map-legend span{display:flex;align-items:center;gap:4px;white-space:nowrap;}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}

/* 관리자 */
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
.toolbar input{padding:7px 10px;border:.5px solid #ccc;border-radius:8px;font-size:13px;background:#fff;font-family:inherit;min-width:180px;}
.card{background:#fff;border:.5px solid #e8e8e4;border-radius:12px;overflow:hidden;margin-bottom:12px;}
.card-header{padding:14px 16px;border-bottom:.5px solid #e8e8e4;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.card-title{font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.card-body{padding:14px 16px;}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-weight:500;font-size:12px;color:#888;padding:8px 10px;border-bottom:.5px solid #e8e8e4;white-space:nowrap;}
td{padding:9px 10px;border-bottom:.5px solid #f0f0ec;vertical-align:middle;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;}
tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#fafaf8;cursor:pointer;}
.count-badge{font-size:11px;background:#f0f0ec;color:#666;padding:2px 7px;border-radius:99px;white-space:nowrap;flex-shrink:0;}

/* 사업장 상세 */
.detail-body{padding:20px 24px;}
.detail-section{background:#fff;border:.5px solid #e8e8e4;border-radius:12px;padding:16px;margin-bottom:12px;}
.detail-section-title{font-size:13px;font-weight:600;color:#185FA5;margin-bottom:10px;padding-bottom:8px;border-bottom:.5px solid #e8e8e4;}
.detail-row{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:.5px solid #f0f0ec;font-size:13px;min-width:0;}
.detail-row:last-child{border-bottom:none;}
.detail-label{font-size:12px;color:#888;min-width:72px;flex-shrink:0;padding-top:1px;white-space:nowrap;}
.detail-val{flex:1;min-width:0;word-break:keep-all;overflow-wrap:break-word;}
.hist-record{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:.5px solid #f0f0ec;flex-wrap:nowrap;font-size:13px;min-width:0;overflow:hidden;}
.hist-record:last-child{border-bottom:none;}
.hist-round{font-size:11px;background:#f0f0ec;color:#666;padding:2px 7px;border-radius:99px;white-space:nowrap;flex-shrink:0;}
.hist-dates{font-size:12px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
.hist-price{font-size:12px;font-weight:500;white-space:nowrap;flex-shrink:0;}

/* 모달 탭 */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:300;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:#fff;border-radius:14px;width:660px;max-width:95vw;max-height:92vh;overflow-y:auto;}
.modal-header{padding:16px 20px;border-bottom:.5px solid #e8e8e4;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:10;}
.modal-header h3{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.modal-tabs{display:flex;gap:0;border-bottom:.5px solid #e8e8e4;padding:0 20px;background:#fff;}
.modal-tab{padding:10px 16px;font-size:13px;font-weight:500;color:#888;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:inherit;white-space:nowrap;}
.modal-tab.active{color:#185FA5;border-bottom-color:#185FA5;}
.modal-body{padding:20px;}
.modal-footer{padding:14px 20px;border-top:.5px solid #e8e8e4;display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:#fff;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-group{display:flex;flex-direction:column;gap:4px;}
.form-group.full{grid-column:1/-1;}
.form-group label{font-size:12px;color:#666;font-weight:500;}
.form-group input,.form-group select,.form-group textarea{padding:7px 10px;border:.5px solid #ccc;border-radius:8px;font-size:13px;font-family:inherit;width:100%;}
.form-group textarea{resize:vertical;min-height:60px;}

/* 히스토리 탭 */
.hist-tab-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:.5px solid #f0f0ec;min-width:0;}
.hist-tab-row:last-child{border-bottom:none;}
.hist-tab-label{font-size:11px;background:#f0f0ec;color:#666;padding:2px 8px;border-radius:99px;white-space:nowrap;flex-shrink:0;}
.hist-tab-label.current{background:#185FA5;color:#fff;}
.hist-tab-info{flex:1;min-width:0;font-size:12px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* 공통 */
.empty-state{text-align:center;padding:36px;color:#aaa;font-size:13px;}
.empty-state i{font-size:28px;display:block;margin-bottom:8px;}
.toast{position:fixed;bottom:24px;right:24px;background:#1a1a18;color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;z-index:999;animation:fadeUp .2s ease;white-space:nowrap;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:900px){
  .resp-layout{grid-template-columns:1fr 1fr;}
  .stat-grid{grid-template-columns:repeat(3,1fr);}
  .contact-row{grid-template-columns:1fr 1fr auto;}
}
@media(max-width:600px){
  .team-layout,.resp-layout{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr;}
  .stat-grid{grid-template-columns:repeat(3,1fr);}
  .page-body,.detail-body{padding:14px 16px;}
  .cal-day{min-height:52px;padding:2px;}
  .cal-event{font-size:8px;padding:1px 2px;}
  .contact-row{grid-template-columns:1fr auto;}
}
  .dash-mini-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:.5px solid #f0f0ec;font-size:13px;cursor:pointer;}
.dash-mini-item:last-child{border-bottom:none;}
.dash-mini-item:hover{color:#185FA5;}
.dash-mini-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.dash-mini-right{font-size:12px;color:#888;white-space:nowrap;flex-shrink:0;margin-left:8px;}
.dash-bar-wrap{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:.5px solid #f0f0ec;}
.dash-bar-wrap:last-child{border-bottom:none;}
.dash-bar-name{font-size:13px;font-weight:500;min-width:100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dash-bar{height:8px;border-radius:4px;background:#185FA5;transition:width .3s;}
.dash-bar-val{font-size:12px;color:#888;white-space:nowrap;margin-left:4px;}
.team-stat-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:.5px solid #f0f0ec;font-size:12px;gap:4px;flex-wrap:nowrap;overflow:hidden;}
.team-stat-row:last-child{border-bottom:none;}
  .sup-row{display:grid;grid-template-columns:80px 110px 120px 80px 1fr 70px;gap:0;align-items:center;padding:9px 12px;border-bottom:.5px solid #f0f0ec;font-size:13px;}
.sup-row:last-child{border-bottom:none;}
.sup-row:hover{background:#fafaf8;}
.sup-row-header{display:grid;grid-template-columns:80px 110px 120px 80px 1fr 70px;gap:0;padding:7px 12px;border-bottom:.5px solid #e8e8e4;font-size:11px;color:#888;font-weight:500;background:#fafaf8;}
.sup-row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .map-label{background:rgba(255,255,255,0.92);border:.5px solid #ddd;border-radius:6px;font-size:11px;padding:3px 7px;box-shadow:0 1px 4px rgba(0,0,0,.12);}
.map-label::before{display:none;}
.leaflet-tooltip-top.map-label::before{display:none;}
</style>
</head>
<body>

<!-- 홈 -->
<div id="home-screen">
  <div class="home-logo">📋 FS 사업장 관리</div>
  <div class="home-sub">온정F&amp;B 사업장 현황 관리 시스템</div>
  <div class="home-menu">
    <div class="home-btn blue" onclick="goPage('dashboard')">
      <i class="ti ti-dashboard"></i>
      <div class="lbl">대시보드</div>
      <div class="desc">계약 현황 한눈에</div>
    </div>
    <div class="home-btn green" onclick="goPage('support')">
      <i class="ti ti-calendar-event"></i>
      <div class="lbl">운영지원</div>
      <div class="desc">지원 일정 관리</div>
    </div>
    <div class="home-btn amber" onclick="goPage('businesses')">
      <i class="ti ti-building"></i>
      <div class="lbl">FS 사업장 현황</div>
      <div class="desc">팀별 · 책임별 · 지도</div>
    </div>
    <div class="home-btn red" onclick="goPage('admin')">
      <i class="ti ti-settings"></i>
      <div class="lbl">관리자 수정</div>
      <div class="desc">계약 추가 · 수정 · 삭제</div>
    </div>
  </div>
</div>

<!-- 앱 -->
<div id="app">
  <div class="top-bar">
    <button class="back-btn" onclick="goHome()"><i class="ti ti-arrow-left"></i> 홈</button>
    <h2 id="page-title"></h2>
    <div class="top-actions" id="top-actions"></div>
  </div>

  <!-- 대시보드 -->
  <div id="page-dashboard" class="page-body" style="display:none;">
    <!-- 오늘 날짜 -->
    <div id="dash-today" style="font-size:13px;color:#888;margin-bottom:14px;"></div>

    <!-- 계약 현황 카드 -->
    <div class="stat-grid" style="margin-bottom:16px;">
      <div class="stat-card" id="card-total" onclick="window.toggleDashCard(this,'all')"></div>
      <div class="stat-card" id="card-urgent" onclick="window.toggleDashCard(this,'urgent')"></div>
      <div class="stat-card" id="card-near" onclick="window.toggleDashCard(this,'near')"></div>
      <div class="stat-card" id="card-auto" onclick="window.toggleDashCard(this,'auto')"></div>
      <div class="stat-card" id="card-ok" onclick="window.toggleDashCard(this,'ok')"></div>
    </div>
    <div class="dash-list-wrap" id="dash-list-wrap" style="display:none;">
      <div id="dash-list"></div>
    </div>

 

    <!-- 이번달/다음달 만료 + 최근 지원 -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">
      <div class="card">
        <div class="card-header"><span class="card-title"><i class="ti ti-calendar-event" style="color:#854F0B;"></i> 이번달 만료 예정</span><span id="dash-thismonth-count" class="count-badge"></span></div>
        <div class="card-body" style="padding:0 16px;" id="dash-thismonth"></div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title"><i class="ti ti-calendar-event" style="color:#185FA5;"></i> 다음달 만료 예정</span><span id="dash-nextmonth-count" class="count-badge"></span></div>
        <div class="card-body" style="padding:0 16px;" id="dash-nextmonth"></div>
      </div>
    </div>

    <!-- 최근 운영지원 -->
    <div class="card" style="margin-bottom:16px;">
      <div class="card-header">
        <span class="card-title"><i class="ti ti-history" style="color:#185FA5;"></i> 최근 7일 운영지원</span>
        <span id="dash-sup-count" class="count-badge"></span>
      </div>
      <div class="card-body" style="padding:0 16px;" id="dash-recent-sup"></div>
    </div>

    <!-- 이번달 지원 많은 사업장 -->
    <div class="card">
      <div class="card-header">
        <span class="card-title"><i class="ti ti-chart-bar" style="color:#185FA5;"></i> 이번달 지원 현황</span>
      </div>
      <div class="card-body" style="padding:0 16px;" id="dash-sup-stat"></div>
    </div>
  </div>

  <!-- 운영지원 -->
  <div id="page-support" class="page-body" style="display:none;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <div id="cal-title" style="font-size:15px;font-weight:600;white-space:nowrap;"></div>
      <div style="display:flex;gap:6px;">
        <button class="btn" onclick="changeMonth(-1)"><i class="ti ti-chevron-left"></i></button>
        <button class="btn" onclick="changeMonth(0)">오늘</button>
        <button class="btn" onclick="changeMonth(1)"><i class="ti ti-chevron-right"></i></button>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px;">
      <div class="card-body" style="padding:8px;"><div id="calendar"></div></div>
    </div>
    <div class="card" style="margin-bottom:16px;">
      <div class="card-header">
        <span class="card-title"><i class="ti ti-plus-circle" style="color:#185FA5;"></i> 운영지원 등록</span>
      </div>
      <div class="card-body">
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px;">
          <div class="sup-form-group">
            <label>업장 선택 *</label>
            <div class="searchable-select">
              <input type="text" id="ss-input" placeholder="업장명 검색..." autocomplete="off"
                oninput="filterSS()" onfocus="openSS()" onblur="setTimeout(closeSS,200)">
              <input type="hidden" id="sup-biz">
              <div class="ss-dropdown" id="ss-dropdown"></div>
            </div>
          </div>
          <div class="sup-form-group">
            <label>일자 *</label>
            <input type="date" id="sup-date">
          </div>
          <div class="sup-form-group">
            <label>시작 시간</label>
            <select id="sup-time-start">
              <option value="">선택...</option>
              <option>08:00</option><option>09:00</option><option>10:00</option>
              <option>11:00</option><option>12:00</option><option>13:00</option>
              <option>14:00</option><option>15:00</option><option>16:00</option>
              <option>17:00</option><option>18:00</option><option>19:00</option><option>20:00</option>
            </select>
          </div>
          <div class="sup-form-group">
            <label>종료 시간</label>
            <select id="sup-time-end">
              <option value="">선택...</option>
              <option>09:00</option><option>10:00</option><option>11:00</option>
              <option>12:00</option><option>13:00</option><option>14:00</option>
              <option>15:00</option><option>16:00</option><option>17:00</option>
              <option>18:00</option><option>19:00</option><option>20:00</option><option>21:00</option>
            </select>
          </div>
          <div class="sup-form-group">
            <label>카테고리 *</label>
            <select id="sup-cat">
              <option value="">선택...</option>
              <option>위생점검</option><option>운영상황체크</option>
              <option>특식지원</option><option>배식지원</option>
              <option>미팅</option><option>기타</option>
            </select>
          </div>
          <div class="sup-form-group" style="grid-column:1/-1;">
            <label>지원자 <button type="button" class="btn sm" onclick="addStaffRow()" style="margin-left:8px;"><i class="ti ti-plus"></i> 추가</button></label>
            <div id="staff-rows" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;">
              <div class="staff-row" style="display:flex;gap:6px;align-items:center;">
                <input type="text" class="staff-input" placeholder="예) 손도란" style="padding:8px 10px;border:.5px solid #ccc;border-radius:8px;font-size:13px;width:140px;">
                <button type="button" class="btn sm danger" onclick="removeStaffRow(this)"><i class="ti ti-x"></i></button>
              </div>
            </div>
          </div>
          <div class="sup-form-group" style="grid-column:1/-1;">
            <label>상세 내용</label>
            <input type="text" id="sup-content" placeholder="지원 내용 간략히">
          </div>
        </div>
        <button class="btn primary" id="sup-submit-btn" onclick="submitSupport()"><i class="ti ti-check"></i> 등록</button>
        <button class="btn" id="sup-cancel-btn" onclick="cancelEditSupport()" style="display:none;margin-left:8px;">취소</button>
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <span class="card-title"><i class="ti ti-history" style="color:#185FA5;"></i> 지원 이력</span>
        <span id="sup-list-count" class="count-badge"></span>
      </div>
      <div class="card-body" style="padding:0 16px;">
        <div id="support-list"></div>
      </div>
    </div>
  </div>

  <!-- FS 사업장 현황 -->
  <div id="page-businesses" class="page-body" style="display:none;">
    <div style="margin-bottom:12px;">
      <input type="text" id="biz-search" placeholder="사업장명 검색..."
        style="padding:8px 12px;border:.5px solid #ccc;border-radius:8px;font-size:13px;width:100%;max-width:280px;"
        oninput="renderBizTab()">
    </div>
    <div class="tab-bar">
      <button class="tab-btn active" onclick="setBizTab('team')">팀별</button>
      <button class="tab-btn" onclick="setBizTab('resp')">책임별</button>
      <button class="tab-btn" onclick="setBizTab('region')">소재지별</button>
    </div>
    <div id="biz-content"></div>
  </div>

  <!-- 관리자 수정 -->
  <div id="page-admin" class="page-body" style="display:none;">
    <div class="toolbar">
      <input type="text" id="admin-search" placeholder="사업장명 검색..." oninput="window.renderAdmin()">
      <span id="admin-count" class="count-badge"></span>
    </div>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>상태</th><th>사업장</th><th>종료일</th><th>D-day</th><th>단가</th><th style="width:60px;"></th>
          </tr></thead>
          <tbody id="admin-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 사업장 상세 -->
<div id="detail-screen">
  <div class="top-bar">
    <button class="back-btn" onclick="goBackFromDetail()"><i class="ti ti-arrow-left"></i> 뒤로</button>
    <h2 id="detail-title"></h2>
    <div class="top-actions">
      <button class="btn sm primary" onclick="openEditModal(window.detailId)"><i class="ti ti-edit"></i> 수정</button>
    </div>
  </div>
  <div class="detail-body" id="detail-body"></div>
</div>

<!-- 계약 모달 -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">계약 추가</h3>
      <button class="btn sm" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-tabs">
      <button class="modal-tab active" id="tab-basic-btn" onclick="switchModalTab('basic')">기본정보</button>
      <button class="modal-tab" id="tab-hist-btn" onclick="switchModalTab('hist')">계약 히스토리</button>
    </div>
    <!-- 기본정보 탭 -->
    <div class="modal-body" id="tab-basic">
      <form id="contract-form" onsubmit="return false;">
        <div class="form-grid">
          <div class="form-group"><label>사업장명 *</label><input type="text" id="f-name"></div>
          <div class="form-group"><label>소재지</label><input type="text" id="f-addr"></div>
          <div class="form-group full">
            <label>담당 영양사 <button type="button" class="btn sm" onclick="addNutriRow()" style="margin-left:8px;"><i class="ti ti-plus"></i> 추가</button></label>
            <div id="nutritionist-rows">
              <div class="nutri-row" style="display:flex;gap:8px;align-items:center;margin-bottom:6px;">
                <input type="text" placeholder="이름 · 직책 (예) 홍길동 영양사" class="nutri-name" style="flex:1;padding:7px 10px;border:.5px solid #ccc;border-radius:8px;font-size:13px;">
                <input type="text" placeholder="연락처" class="nutri-phone" oninput="formatPhone(this)" style="flex:1;padding:7px 10px;border:.5px solid #ccc;border-radius:8px;font-size:13px;">
                <button type="button" class="btn sm danger" onclick="removeNutriRow(this)"><i class="ti ti-trash"></i></button>
              </div>
            </div>
          </div>
          <div class="form-group full">
            <label>담당자 <button type="button" class="btn sm" onclick="addContactRow()" style="margin-left:8px;"><i class="ti ti-plus"></i> 추가</button></label>
            <div id="contact-rows">
              <div class="contact-row">
                <input type="text" placeholder="이름 · 직책" class="contact-name">
                <input type="text" placeholder="연락처" class="contact-phone" oninput="formatPhone(this)">
                <input type="text" placeholder="대표번호" class="contact-tel" oninput="formatPhone(this)">
                <button type="button" class="btn sm danger" onclick="removeContactRow(this)"><i class="ti ti-trash"></i></button>
              </div>
            </div>
          </div>
          <div class="form-group"><label>팀</label>
            <select id="f-team"><option value="1">1팀 (박주형)</option><option value="2">2팀 (김재희)</option></select>
          </div>
          <div class="form-group"><label>책임</label>
            <select id="f-resp">
              <option value="">선택...</option>
              <option>손도란 대리</option><option>이소영 주임</option>
              <option>김상준 주임</option><option>견병록 매니저</option>
            </select>
          </div>
          <div class="form-group"><label>계약 시작일</label><input type="date" id="f-startDate"></div>
          <div class="form-group"><label>계약 종료일 *</label><input type="date" id="f-endDate"></div>
          <div class="form-group"><label>계약단가 (원)</label><input type="number" id="f-price"></div>
          <div class="form-group"><label>단가 구분</label>
            <select id="f-priceType">
              <option value="per-meal">식수 단가 (원/식)</option>
              <option value="management">관리비제</option>
              <option value="fixed">월 고정금액</option>
            </select>
          </div>
          <div class="form-group"><label>월평균식수</label><input type="number" id="f-avgMeals"></div>
          <div class="form-group full">
            <label>운영끼니</label>
            <div class="meal-select-wrap">
              <div class="meal-day-section">
                <div class="meal-day-header"><span class="meal-day-label">평일</span></div>
                <div class="meal-chips">
                  <label class="meal-chip"><input type="checkbox" class="meal-cb" data-day="weekday" value="조" onchange="updateChip(this)"> 조식</label>
                  <label class="meal-chip"><input type="checkbox" class="meal-cb" data-day="weekday" value="중" onchange="updateChip(this)"> 중식</label>
                  <label class="meal-chip"><input type="checkbox" class="meal-cb" data-day="weekday" value="석" onchange="updateChip(this)"> 석식</label>
                  <label class="meal-chip"><input type="checkbox" class="meal-cb" data-day="weekday" value="야" onchange="updateChip(this)"> 야식</label>
                </div>
              </div>
              <div class="meal-day-section">
                <div class="meal-day-header">
                  <label class="meal-chip" style="border:none;padding:0;background:none;font-weight:600;font-size:12px;color:#444;gap:6px;">
                    <input type="checkbox" id="meal-sat" onchange="toggleWeekend('sat')"> 토요일 운영
                  </label>
                </div>
                <div class="meal-chips" id="meal-sat-sub" style="display:none;">
                  <label class="meal-chip"><input type="checkbox" class="meal-cb" data-day="sat" value="조" onchange="updateChip(this)"> 조식</label>
                  <label class="meal-chip"><input type="checkbox" class="meal-cb" data-day="sat" value="중" onchange="updateChip(this)"> 중식</label>
                  <label class="meal-chip"><input type="checkbox" class="meal-cb" data-day="sat" value="석" onchange="updateChip(this)"> 석식</label>
                  <label class="meal-chip"><input type="checkbox" class="meal-cb" data-day="sat" value="야" onchange="updateChip(this)"> 야식</label>
                </div>
              </div>
              <div class="meal-day-section">
                <div class="meal-day-header">
                  <label class="meal-chip" style="border:none;padding:0;background:none;font-weight:600;font-size:12px;color:#444;gap:6px;">
                    <input type="checkbox" id="meal-sun" onchange="toggleWeekend('sun')"> 일요일 운영
                  </label>
                </div>
                <div class="meal-chips" id="meal-sun-sub" style="display:none;">
                  <label class="meal-chip"><input type="checkbox" class="meal-cb" data-day="sun" value="조" onchange="updateChip(this)"> 조식</label>
                  <label class="meal-chip"><input type="checkbox" class="meal-cb" data-day="sun" value="중" onchange="updateChip(this)"> 중식</label>
                  <label class="meal-chip"><input type="checkbox" class="meal-cb" data-day="sun" value="석" onchange="updateChip(this)"> 석식</label>
                  <label class="meal-chip"><input type="checkbox" class="meal-cb" data-day="sun" value="야" onchange="updateChip(this)"> 야식</label>
                </div>
              </div>
            </div>
          </div>
          <div class="form-group full"><label>특이사항</label><textarea id="f-note"></textarea></div>
        </div>
      </form>
    </div>
    <!-- 히스토리 탭 -->
    <div class="modal-body" id="tab-hist" style="display:none;">
      <div style="display:flex;justify-content:flex-end;margin-bottom:12px;">
        <button class="btn primary sm" onclick="addHistRow()"><i class="ti ti-plus"></i> 이력 추가</button>
      </div>
      <div id="hist-list"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">닫기</button>
      <button class="btn primary" id="modal-save-btn" onclick="saveContract()"><i class="ti ti-check"></i> 저장</button>
    </div>
  </div>
</div>

<script type="module" src="./src/js/app.js"></script>
</body>
</html>
