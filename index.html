<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FS 사업장 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
window.kakaoReady = false;
function loadKakao() {
  var script = document.createElement('script');
  script.src = '//dapi.kakao.com/v2/maps/sdk.js?appkey=aefff94dbfce9edffe1c0e100dc4de55&libraries=services&autoload=false';
  script.onload = function() { kakao.maps.load(function(){ window.kakaoReady = true; }); };
  document.head.appendChild(script);
}
window.addEventListener('load', loadKakao);
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --blue:#2563EB;
  --blue-light:#EFF6FF;
  --blue-mid:#BFDBFE;
  --red:#DC2626;
  --red-light:#FEF2F2;
  --amber:#D97706;
  --amber-light:#FFFBEB;
  --green:#16A34A;
  --green-light:#F0FDF4;
  --gray-50:#F8FAFC;
  --gray-100:#F1F5F9;
  --gray-200:#E2E8F0;
  --gray-300:#CBD5E1;
  --gray-400:#94A3B8;
  --gray-500:#64748B;
  --gray-600:#475569;
  --gray-800:#1E293B;
  --gray-900:#0F172A;
  --radius:12px;
  --radius-sm:8px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.04);
  --shadow-lg:0 10px 15px rgba(0,0,0,.08),0 4px 6px rgba(0,0,0,.04);
}
body{font-family:'Pretendard','Noto Sans KR',sans-serif;background:var(--gray-50);color:var(--gray-900);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased;}

/* 앱 레이아웃 */
#app-shell{display:flex;flex-direction:column;min-height:100vh;max-width:480px;margin:0 auto;background:#fff;position:relative;}
.page-content{flex:1;overflow-y:auto;padding-bottom:80px;}

/* 상단 헤더 */
.app-header{padding:16px 20px 12px;background:#fff;border-bottom:1px solid var(--gray-100);position:sticky;top:0;z-index:100;}
.app-header-inner{display:flex;align-items:center;justify-content:space-between;}
.app-header h1{font-size:18px;font-weight:700;color:var(--gray-900);}
.app-header-sub{font-size:12px;color:var(--gray-400);margin-top:2px;}
.header-actions{display:flex;gap:8px;}

/* 하단 탭바 */
.tab-bar-bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--gray-100);display:grid;grid-template-columns:repeat(4,1fr);z-index:200;padding-bottom:env(safe-area-inset-bottom);}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;cursor:pointer;color:var(--gray-400);transition:color .15s;border:none;background:none;font-family:inherit;}
.tab-item.active{color:var(--blue);}
.tab-item i{font-size:22px;}
.tab-item span{font-size:10px;font-weight:500;}
.tab-badge{position:relative;}
.tab-badge-dot{position:absolute;top:-2px;right:-6px;width:8px;height:8px;background:var(--red);border-radius:50%;border:2px solid #fff;}

/* 섹션 */
.section{padding:16px 20px;}
.section-title{font-size:13px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;}

/* 카드 */
.card{background:#fff;border-radius:var(--radius);border:1px solid var(--gray-100);box-shadow:var(--shadow);overflow:hidden;}
.card+.card{margin-top:12px;}
.card-body{padding:16px;}

/* 버튼 */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);border:none;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:hover{background:#1D4ED8;}
.btn-ghost{background:transparent;color:var(--gray-600);border:1px solid var(--gray-200);}
.btn-ghost:hover{background:var(--gray-50);}
.btn-danger{background:var(--red-light);color:var(--red);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-icon{padding:8px;border-radius:var(--radius-sm);background:var(--gray-100);color:var(--gray-600);border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
.btn-icon:hover{background:var(--gray-200);}

/* FAB */
.fab{position:fixed;bottom:90px;right:calc(50% - 220px);width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;border:none;font-size:24px;cursor:pointer;box-shadow:0 4px 12px rgba(37,99,235,.4);display:flex;align-items:center;justify-content:center;z-index:150;transition:transform .15s;}
.fab:hover{transform:scale(1.05);}
@media(max-width:480px){.fab{right:20px;}}

/* 배지 */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap;}
.badge-urgent{background:var(--red-light);color:var(--red);}
.badge-near{background:var(--amber-light);color:var(--amber);}
.badge-ok{background:var(--green-light);color:var(--green);}
.badge-auto{background:var(--blue-light);color:var(--blue);}
.badge-gray{background:var(--gray-100);color:var(--gray-600);}

/* 상태 점 */
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dot-urgent{background:var(--red);}
.dot-near{background:var(--amber);}
.dot-ok{background:var(--green);}
.dot-auto{background:var(--blue);}

/* 담당자 칩 - 4가지로 통일 */
.staff-chip{display:inline-flex;align-items:center;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:500;white-space:nowrap;}
.chip-a{background:#EFF6FF;color:#1D4ED8;}
.chip-b{background:#F0FDF4;color:#15803D;}
.chip-c{background:#FFF7ED;color:#C2410C;}
.chip-d{background:#FDF4FF;color:#7E22CE;}
.chip-e{background:#F0FDF4;color:#065F46;}
.chip-f{background:#FFFBEB;color:#92400E;}
.chip-g{background:#FEF2F2;color:#B91C1C;}
.chip-h{background:#F8FAFC;color:#475569;}
.chip-i{background:#FDF2F8;color:#9D174D;}

/* 리스트 아이템 */
.list-item{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--gray-100);cursor:pointer;transition:background .1s;}
.list-item:last-child{border-bottom:none;}
.list-item:hover{background:var(--gray-50);}
.list-item-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.list-item-body{flex:1;min-width:0;}
.list-item-title{font-size:14px;font-weight:600;color:var(--gray-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.list-item-sub{font-size:12px;color:var(--gray-400);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.list-item-right{flex-shrink:0;text-align:right;}

/* 대시보드 stat */
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 20px;}
.stat-box{background:var(--gray-50);border-radius:var(--radius);padding:14px;border:1px solid var(--gray-100);}
.stat-box-label{font-size:11px;color:var(--gray-400);font-weight:500;margin-bottom:6px;}
.stat-box-val{font-size:28px;font-weight:700;line-height:1;}
.stat-box-sub{font-size:11px;color:var(--gray-400);margin-top:4px;}
.stat-urgent .stat-box-val{color:var(--red);}
.stat-near .stat-box-val{color:var(--amber);}

/* 알림 배너 */
.alert-banner{margin:16px 20px;padding:14px 16px;border-radius:var(--radius);display:flex;align-items:flex-start;gap:12px;}
.alert-urgent{background:var(--red-light);border:1px solid #FECACA;}
.alert-icon{font-size:18px;flex-shrink:0;margin-top:1px;}
.alert-body{flex:1;min-width:0;}
.alert-title{font-size:13px;font-weight:600;margin-bottom:4px;}
.alert-urgent .alert-title{color:var(--red);}
.alert-item{font-size:12px;color:var(--gray-600);padding:2px 0;display:flex;align-items:center;gap:6px;}

/* 달력 */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--gray-200);border-radius:var(--radius);overflow:hidden;}
.cal-header-cell{background:var(--gray-50);text-align:center;font-size:11px;font-weight:600;color:var(--gray-400);padding:8px 0;}
.cal-cell{background:#fff;min-height:72px;padding:4px;cursor:pointer;transition:background .1s;}
.cal-cell:hover{background:var(--gray-50);}
.cal-cell.empty{background:var(--gray-50);cursor:default;}
.cal-cell.today .cal-date{background:var(--blue);color:#fff;border-radius:50%;}
.cal-date{font-size:11px;font-weight:500;width:20px;height:20px;display:flex;align-items:center;justify-content:center;margin-bottom:3px;}
.cal-dot-row{display:flex;gap:2px;flex-wrap:wrap;padding:1px 2px;}
.cal-dot{width:6px;height:6px;border-radius:50%;}
.cal-event-pill{font-size:8px;padding:1px 4px;border-radius:3px;margin-bottom:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;}

/* 주간 뷰 */
.week-view{overflow-x:auto;}
.week-table{min-width:500px;width:100%;}
.week-table th{font-size:11px;font-weight:600;color:var(--gray-400);padding:8px 6px;text-align:center;border-bottom:1px solid var(--gray-100);}
.week-table th.today-col{color:var(--blue);}
.week-table td{padding:4px 3px;vertical-align:top;border-bottom:1px solid var(--gray-100);min-width:52px;}
.week-table td.today-col{background:var(--blue-light);}
.week-staff-name{font-size:10px;font-weight:600;color:var(--gray-600);padding:8px 6px;white-space:nowrap;border-bottom:1px solid var(--gray-100);}
.week-event{font-size:9px;padding:2px 5px;border-radius:4px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;line-height:1.4;}

/* 검색 */
.search-bar{display:flex;align-items:center;gap:8px;background:var(--gray-100);border-radius:var(--radius-sm);padding:8px 12px;margin:12px 20px;}
.search-bar i{color:var(--gray-400);font-size:16px;flex-shrink:0;}
.search-bar input{background:none;border:none;outline:none;font-size:13px;color:var(--gray-900);flex:1;font-family:inherit;}
.search-bar input::placeholder{color:var(--gray-400);}

/* 세그먼트 컨트롤 */
.segment{display:flex;background:var(--gray-100);border-radius:var(--radius-sm);padding:3px;margin:0 20px 16px;}
.segment-btn{flex:1;padding:6px;border-radius:6px;border:none;background:none;font-size:12px;font-weight:500;color:var(--gray-500);cursor:pointer;font-family:inherit;transition:all .15s;}
.segment-btn.active{background:#fff;color:var(--gray-900);box-shadow:var(--shadow);}

/* 사업장 카드 */
.biz-card{padding:14px 16px;border-bottom:1px solid var(--gray-100);cursor:pointer;transition:background .1s;}
.biz-card:hover{background:var(--gray-50);}
.biz-card:last-child{border-bottom:none;}
.biz-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.biz-card-name{font-size:14px;font-weight:600;color:var(--gray-900);}
.biz-card-info{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gray-400);}
.biz-card-dday{font-size:13px;font-weight:600;}

/* 모달 */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:300;align-items:flex-end;justify-content:center;}
.modal-backdrop.open{display:flex;}
.modal-sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom);}
.modal-handle{width:36px;height:4px;background:var(--gray-200);border-radius:2px;margin:12px auto 16px;}
.modal-header{padding:0 20px 16px;display:flex;align-items:center;justify-content:space-between;}
.modal-header h3{font-size:17px;font-weight:700;}
.modal-body{padding:0 20px 20px;}
.modal-footer{padding:12px 20px;border-top:1px solid var(--gray-100);display:flex;gap:8px;}
.modal-footer .btn{flex:1;justify-content:center;}

/* 폼 */
.form-group{margin-bottom:16px;}
.form-label{font-size:12px;font-weight:600;color:var(--gray-500);margin-bottom:6px;display:block;}
.form-input{width:100%;padding:10px 12px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;color:var(--gray-900);background:#fff;outline:none;transition:border-color .15s;}
.form-input:focus{border-color:var(--blue);}
.form-textarea{width:100%;padding:10px 12px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;color:var(--gray-900);background:#fff;outline:none;resize:vertical;min-height:80px;transition:border-color .15s;}
.form-textarea:focus{border-color:var(--blue);}
.form-select{width:100%;padding:10px 12px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;color:var(--gray-900);background:#fff;outline:none;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* 칩 선택 */
.chip-select{display:flex;flex-wrap:wrap;gap:6px;}
.chip-option{padding:6px 12px;border-radius:99px;border:1px solid var(--gray-200);font-size:12px;font-weight:500;cursor:pointer;color:var(--gray-600);background:#fff;transition:all .15s;user-select:none;}
.chip-option:hover{border-color:var(--blue);color:var(--blue);}
.chip-option.selected{background:var(--blue);color:#fff;border-color:var(--blue);}
.chip-option.selected.chip-a{background:#1D4ED8;border-color:#1D4ED8;}
.chip-option.selected.chip-b{background:#15803D;border-color:#15803D;}
.chip-option.selected.chip-c{background:#C2410C;border-color:#C2410C;}
.chip-option.selected.chip-d{background:#7E22CE;border-color:#7E22CE;}
.chip-option.selected.chip-e{background:#065F46;border-color:#065F46;}
.chip-option.selected.chip-f{background:#92400E;border-color:#92400E;}
.chip-option.selected.chip-g{background:#B91C1C;border-color:#B91C1C;}
.chip-option.selected.chip-h{background:#475569;border-color:#475569;}
.chip-option.selected.chip-i{background:#9D174D;border-color:#9D174D;}

/* 계약 모달 (기존 유지) */
.contract-modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:300;align-items:center;justify-content:center;}
.contract-modal-overlay.open{display:flex;}
.contract-modal{background:#fff;border-radius:var(--radius);width:660px;max-width:95vw;max-height:92vh;overflow-y:auto;}
.contract-modal-header{padding:16px 20px;border-bottom:1px solid var(--gray-100);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:10;}
.contract-modal-header h3{font-size:16px;font-weight:700;}
.contract-modal-tabs{display:flex;border-bottom:1px solid var(--gray-100);padding:0 20px;background:#fff;}
.contract-modal-tab{padding:10px 16px;font-size:13px;font-weight:500;color:var(--gray-400);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:inherit;}
.contract-modal-tab.active{color:var(--blue);border-bottom-color:var(--blue);}
.contract-modal-body{padding:20px;}
.contract-modal-footer{padding:14px 20px;border-top:1px solid var(--gray-100);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:#fff;}
.contract-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.contract-form-group{display:flex;flex-direction:column;gap:4px;}
.contract-form-group.full{grid-column:1/-1;}
.contract-form-group label{font-size:12px;font-weight:500;color:var(--gray-500);}
.contract-form-group input,.contract-form-group select,.contract-form-group textarea{padding:8px 10px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;width:100%;outline:none;}
.contract-form-group input:focus,.contract-form-group select:focus,.contract-form-group textarea:focus{border-color:var(--blue);}
.contract-form-group textarea{resize:vertical;min-height:60px;}
.hist-tab-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--gray-100);}
.hist-tab-row:last-child{border-bottom:none;}
.hist-tab-label{font-size:11px;background:var(--gray-100);color:var(--gray-600);padding:2px 8px;border-radius:99px;white-space:nowrap;flex-shrink:0;}
.hist-tab-label.current{background:var(--blue);color:#fff;}
.hist-tab-info{flex:1;min-width:0;font-size:12px;color:var(--gray-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* 운영끼니 */
.meal-wrap{border:1px solid var(--gray-200);border-radius:var(--radius-sm);overflow:hidden;}
.meal-section{border-bottom:1px solid var(--gray-100);}
.meal-section:last-child{border-bottom:none;}
.meal-section-header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--gray-50);}
.meal-chips-row{display:flex;gap:6px;flex-wrap:wrap;padding:6px 12px 10px;}
.meal-chip-label{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border:1px solid var(--gray-200);border-radius:99px;font-size:12px;cursor:pointer;background:#fff;transition:all .1s;user-select:none;}
.meal-chip-label input{display:none;}
.meal-chip-label.checked{background:var(--blue);color:#fff;border-color:var(--blue);}

/* 검색 드롭다운 */
.searchable-wrap{position:relative;}
.search-dropdown{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-sm);max-height:200px;overflow-y:auto;z-index:100;box-shadow:var(--shadow-md);margin-top:4px;}
.search-dropdown.open{display:block;}
.search-opt{padding:10px 12px;font-size:13px;cursor:pointer;}
.search-opt:hover{background:var(--gray-50);}

/* 사업장 상세 */
.detail-section{background:#fff;border-radius:var(--radius);border:1px solid var(--gray-100);padding:16px;margin-bottom:12px;}
.detail-section-title{font-size:12px;font-weight:600;color:var(--blue);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;}
.detail-row{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--gray-100);font-size:13px;}
.detail-row:last-child{border-bottom:none;}
.detail-label{font-size:12px;color:var(--gray-400);min-width:68px;flex-shrink:0;padding-top:1px;}
.detail-val{flex:1;color:var(--gray-800);word-break:keep-all;}
.hist-record{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--gray-100);font-size:13px;}
.hist-record:last-child{border-bottom:none;}
.hist-round{font-size:11px;background:var(--gray-100);color:var(--gray-600);padding:2px 7px;border-radius:99px;white-space:nowrap;text-align:center;}
.sup-hist-row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--gray-100);font-size:13px;}
.sup-hist-row:last-child{border-bottom:none;}

/* 지원이력 그리드 */
.sup-list-header{display:grid;grid-template-columns:72px 80px 1fr 80px 90px;gap:0;padding:8px 16px;background:var(--gray-50);border-bottom:1px solid var(--gray-100);font-size:11px;color:var(--gray-400);font-weight:600;}
.sup-list-row{display:grid;grid-template-columns:72px 80px 1fr 80px 90px;gap:0;padding:10px 16px;border-bottom:1px solid var(--gray-100);font-size:13px;align-items:center;}
.sup-list-row:last-child{border-bottom:none;}
.sup-list-row:hover{background:var(--gray-50);}
.sup-list-row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* 지도 */
#map{height:450px;border-radius:var(--radius);border:1px solid var(--gray-100);}
.map-label{background:rgba(255,255,255,.95);border:1px solid var(--gray-200);border-radius:6px;font-size:11px;font-weight:500;padding:3px 7px;box-shadow:var(--shadow);}
.map-label::before{display:none;}

/* 관리자 */
.admin-row{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--gray-100);cursor:pointer;transition:background .1s;}
.admin-row:hover{background:var(--gray-50);}
.admin-row:last-child{border-bottom:none;}

/* 토스트 */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--gray-900);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:500;z-index:999;animation:toastUp .2s ease;white-space:nowrap;box-shadow:var(--shadow-lg);}
@keyframes toastUp{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* 빈 상태 */
.empty{text-align:center;padding:48px 20px;color:var(--gray-400);}
.empty i{font-size:36px;display:block;margin-bottom:12px;opacity:.4;}
.empty p{font-size:14px;}

/* 접촉 행 */
.contact-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px;}
.contact-row input{padding:8px 10px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;width:100%;}

@media(max-width:600px){
  .contract-form-grid{grid-template-columns:1fr;}
  .contract-form-group.full{grid-column:1;}
  .sup-list-header,.sup-list-row{grid-template-columns:64px 1fr 72px 60px;}
  .sup-list-header span:nth-child(3),.sup-list-row span:nth-child(3){display:none;}
  .contact-row{grid-template-columns:1fr auto;}
}
</style>
</head>
<body>

<div id="app-shell">
  <!-- 상단 헤더 -->
  <div class="app-header" id="app-header">
    <div class="app-header-inner">
      <div>
        <h1 id="page-title">대시보드</h1>
        <div class="app-header-sub" id="page-subtitle"></div>
      </div>
      <div class="header-actions" id="header-actions"></div>
    </div>
  </div>

  <!-- 페이지 콘텐츠 -->
  <div class="page-content" id="page-content">

    <!-- 대시보드 -->
    <div id="page-dashboard" style="display:none;">
      <div id="urgent-banner"></div>
      <div class="stat-row">
        <div class="stat-box stat-urgent" onclick="showStatusList('urgent')" style="cursor:pointer;">
          <div class="stat-box-label">긴급 D-30</div>
          <div class="stat-box-val" id="stat-urgent">-</div>
          <div class="stat-box-sub">개소</div>
        </div>
        <div class="stat-box stat-near" onclick="showStatusList('near')" style="cursor:pointer;">
          <div class="stat-box-label">임박 D-90</div>
          <div class="stat-box-val" id="stat-near">-</div>
          <div class="stat-box-sub">개소</div>
        </div>
      </div>
      <div id="status-list-wrap" style="display:none;padding:0 20px 16px;">
        <div class="card" id="status-list"></div>
      </div>
      <div style="padding:0 20px 16px;">
        <div class="section-title">오늘 팀 일정</div>
        <div class="card" id="dash-today-sched"></div>
      </div>
      <div style="padding:0 20px 16px;">
        <div class="section-title">이번달 만료 예정</div>
        <div class="card" id="dash-thismonth"></div>
      </div>
      <div style="padding:0 20px 16px;">
        <div class="section-title">최근 7일 운영지원</div>
        <div class="card" id="dash-recent-sup"></div>
      </div>
    </div>

    <!-- 운영지원 -->
    <div id="page-support" style="display:none;">
      <div style="padding:12px 20px 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <div style="display:flex;gap:6px;align-items:center;">
          <button class="btn-icon" onclick="changeMonth(-1)"><i class="ti ti-chevron-left" style="font-size:16px;"></i></button>
          <span id="cal-title" style="font-size:15px;font-weight:700;min-width:80px;text-align:center;"></span>
          <button class="btn-icon" onclick="changeMonth(1)"><i class="ti ti-chevron-right" style="font-size:16px;"></i></button>
          <button class="btn-icon" onclick="changeMonth(0)" title="오늘"><i class="ti ti-calendar-event" style="font-size:16px;"></i></button>
        </div>
        <div style="display:flex;gap:6px;margin-left:auto;">
          <div style="background:var(--gray-100);border-radius:8px;padding:3px;display:flex;gap:2px;">
            <button class="segment-btn active" id="view-week-btn" onclick="setCalView('week')">주간</button>
            <button class="segment-btn" id="view-month-btn" onclick="setCalView('month')">월간</button>
          </div>
        </div>
      </div>
      <!-- 담당자 필터 -->
      <div style="padding:0 20px 12px;display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;">
        <button class="chip-option selected" id="filter-all" onclick="setStaffFilter(null)" style="flex-shrink:0;">전체</button>
        <div style="position:relative;flex-shrink:0;">
          <button class="chip-option" onclick="toggleTeamDropdown('op-dropdown')" style="gap:4px;">운영팀 <i class="ti ti-chevron-down" style="font-size:10px;"></i></button>
          <div id="op-dropdown" style="display:none;position:absolute;top:100%;left:0;background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-sm);box-shadow:var(--shadow-md);z-index:100;min-width:130px;padding:4px 0;margin-top:4px;">
            <div style="padding:8px 14px;font-size:13px;cursor:pointer;" onmousedown="setStaffFilter('박주형');closeDropdowns()">박주형 본부장</div>
            <div style="padding:8px 14px;font-size:13px;cursor:pointer;" onmousedown="setStaffFilter('김재희');closeDropdowns()">김재희 차장</div>
            <div style="padding:8px 14px;font-size:13px;cursor:pointer;" onmousedown="setStaffFilter('손도란');closeDropdowns()">손도란 대리</div>
            <div style="padding:8px 14px;font-size:13px;cursor:pointer;" onmousedown="setStaffFilter('이소영');closeDropdowns()">이소영 주임</div>
            <div style="padding:8px 14px;font-size:13px;cursor:pointer;" onmousedown="setStaffFilter('김상준');closeDropdowns()">김상준 주임</div>
            <div style="padding:8px 14px;font-size:13px;cursor:pointer;" onmousedown="setStaffFilter('안은재');closeDropdowns()">안은재 주임</div>
            <div style="padding:8px 14px;font-size:13px;cursor:pointer;" onmousedown="setStaffFilter('견병록');closeDropdowns()">견병록 매니저</div>
          </div>
        </div>
        <div style="position:relative;flex-shrink:0;">
          <button class="chip-option" onclick="toggleTeamDropdown('sup-dropdown')" style="gap:4px;">지원팀 <i class="ti ti-chevron-down" style="font-size:10px;"></i></button>
          <div id="sup-dropdown" style="display:none;position:absolute;top:100%;left:0;background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-sm);box-shadow:var(--shadow-md);z-index:100;min-width:130px;padding:4px 0;margin-top:4px;">
            <div style="padding:8px 14px;font-size:13px;cursor:pointer;" onmousedown="setStaffFilter('임성창');closeDropdowns()">임성창 차장</div>
            <div style="padding:8px 14px;font-size:13px;cursor:pointer;" onmousedown="setStaffFilter('김동현');closeDropdowns()">김동현 대리</div>
          </div>
        </div>
        <span id="active-filter-label" style="display:none;font-size:12px;color:var(--blue);font-weight:500;align-self:center;flex-shrink:0;"></span>
      </div>
      <!-- 달력/주간 -->
      <div style="padding:0 20px 16px;">
        <div class="card" style="overflow:hidden;">
          <div id="calendar" style="padding:8px;"></div>
        </div>
      </div>
      <!-- 지원 이력 -->
      <div style="padding:0 20px 16px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
          <div class="section-title" style="margin-bottom:0;">지원 이력</div>
          <span id="sup-list-count" style="font-size:12px;color:var(--gray-400);"></span>
        </div>
        <div class="card">
          <div class="sup-list-header">
            <span>날짜</span><span>끼니</span><span>업장/지원자</span><span>카테고리</span><span style="text-align:right;">액션</span>
          </div>
          <div id="support-list"></div>
        </div>
      </div>
    </div>

    <!-- 사업장 현황 -->
    <div id="page-businesses" style="display:none;">
      <div class="search-bar">
        <i class="ti ti-search"></i>
        <input type="text" id="biz-search" placeholder="사업장명 검색..." oninput="renderBizTab()">
      </div>
      <div class="segment">
        <button class="segment-btn active" onclick="setBizTab('team')">팀별</button>
        <button class="segment-btn" onclick="setBizTab('resp')">책임별</button>
        <button class="segment-btn" onclick="setBizTab('region')">지도</button>
      </div>
      <div id="biz-content" style="padding:0 20px 16px;"></div>
    </div>

    <!-- 관리 -->
    <div id="page-admin" style="display:none;">
      <div class="search-bar">
        <i class="ti ti-search"></i>
        <input type="text" id="admin-search" placeholder="사업장명 검색..." oninput="window.renderAdmin()">
        <span id="admin-count" style="font-size:12px;color:var(--gray-400);white-space:nowrap;"></span>
      </div>
      <div style="padding:0 20px 16px;">
        <div class="card">
          <div id="admin-list"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- 하단 탭바 -->
  <div class="tab-bar-bottom">
    <button class="tab-item active" id="tab-dashboard" onclick="goPage('dashboard')">
      <i class="ti ti-home"></i>
      <span>대시보드</span>
    </button>
    <button class="tab-item" id="tab-support" onclick="goPage('support')">
      <div class="tab-badge">
        <i class="ti ti-calendar-event"></i>
      </div>
      <span>운영지원</span>
    </button>
    <button class="tab-item" id="tab-businesses" onclick="goPage('businesses')">
      <i class="ti ti-building"></i>
      <span>사업장</span>
    </button>
    <button class="tab-item" id="tab-admin" onclick="goPage('admin')">
      <i class="ti ti-settings"></i>
      <span>관리</span>
    </button>
  </div>
</div>

<!-- 사업장 상세 -->
<div id="detail-screen" style="display:none;flex-direction:column;min-height:100vh;max-width:480px;margin:0 auto;background:var(--gray-50);">
  <div class="app-header">
    <div class="app-header-inner">
      <button onclick="goBackFromDetail()" style="background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--blue);font-family:inherit;font-weight:500;padding:0;">
        <i class="ti ti-arrow-left"></i> 뒤로
      </button>
      <div class="header-actions">
        <button class="btn btn-ghost btn-sm" onclick="openEditModal(window.detailId)"><i class="ti ti-edit"></i> 수정</button>
      </div>
    </div>
    <div style="margin-top:8px;">
      <h1 id="detail-title" style="font-size:18px;font-weight:700;"></h1>
    </div>
  </div>
  <div style="padding:16px 20px;flex:1;overflow-y:auto;padding-bottom:40px;" id="detail-body"></div>
</div>

<!-- FAB 운영지원 등록 -->
<button class="fab" id="sup-fab" onclick="openSupportModal()" style="display:none;">
  <i class="ti ti-plus"></i>
</button>

<!-- 운영지원 등록 모달 -->
<div class="modal-backdrop" id="sup-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h3 id="sup-modal-title">운영지원 등록</h3>
      <button class="btn-icon" onclick="closeSupportModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">업장 선택 *</label>
        <div class="searchable-wrap">
          <input type="text" class="form-input" id="ss-input" placeholder="업장명 검색..." autocomplete="off"
            oninput="filterSS()" onfocus="openSS()" onblur="setTimeout(closeSS,200)">
          <input type="hidden" id="sup-biz">
          <div class="search-dropdown" id="ss-dropdown"></div>
        </div>
        <div id="sup-nutri-info" style="display:none;font-size:12px;color:var(--blue);margin-top:6px;padding:6px 10px;background:var(--blue-light);border-radius:var(--radius-sm);font-weight:500;"></div>
      </div>
      <div class="form-grid" style="margin-bottom:16px;">
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label">일자 *</label>
          <input type="date" class="form-input" id="sup-date">
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label">카테고리 *</label>
          <select class="form-select" id="sup-cat">
            <option value="">선택...</option>
            <option>위생점검</option><option>운영점검</option>
            <option>특식지원</option><option>배식지원</option>
            <option>식사제공</option><option>미팅상담</option>
            <option>기타지원</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">끼니</label>
        <div class="chip-select" id="meal-chip-wrap">
          <div class="chip-option" onclick="toggleMealChip(this,'조식')">조식</div>
          <div class="chip-option" onclick="toggleMealChip(this,'중식')">중식</div>
          <div class="chip-option" onclick="toggleMealChip(this,'석식')">석식</div>
          <div class="chip-option" onclick="toggleMealChip(this,'야식')">야식</div>
          <div class="chip-option" onclick="toggleMealChip(this,'기타')">기타</div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">지원자</label>
        <div style="margin-bottom:6px;font-size:11px;color:var(--gray-400);font-weight:600;">운영팀</div>
        <div class="chip-select" id="staff-chip-wrap" style="margin-bottom:8px;">
          <div class="chip-option chip-a" onclick="toggleStaffChip(this,'박주형 본부장')">박주형 본부장</div>
          <div class="chip-option chip-b" onclick="toggleStaffChip(this,'김재희 차장')">김재희 차장</div>
          <div class="chip-option chip-c" onclick="toggleStaffChip(this,'손도란 대리')">손도란 대리</div>
          <div class="chip-option chip-d" onclick="toggleStaffChip(this,'이소영 주임')">이소영 주임</div>
          <div class="chip-option chip-e" onclick="toggleStaffChip(this,'김상준 주임')">김상준 주임</div>
          <div class="chip-option chip-f" onclick="toggleStaffChip(this,'안은재 주임')">안은재 주임</div>
          <div class="chip-option chip-g" onclick="toggleStaffChip(this,'견병록 매니저')">견병록 매니저</div>
        </div>
        <div style="margin-bottom:6px;font-size:11px;color:var(--gray-400);font-weight:600;">지원팀</div>
        <div class="chip-select">
          <div class="chip-option chip-h" onclick="toggleStaffChip(this,'임성창 차장')">임성창 차장</div>
          <div class="chip-option chip-i" onclick="toggleStaffChip(this,'김동현 대리')">김동현 대리</div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">상세 내용</label>
        <textarea class="form-textarea" id="sup-content" placeholder="지원 내용을 간략히 입력해주세요"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeSupportModal()">취소</button>
      <button class="btn btn-primary" id="sup-submit-btn" onclick="submitSupport()"><i class="ti ti-check"></i> 등록</button>
    </div>
  </div>
</div>

<!-- 계약 모달 -->
<div class="contract-modal-overlay" id="modal-overlay">
  <div class="contract-modal">
    <div class="contract-modal-header">
      <h3 id="modal-title">계약 추가</h3>
      <button class="btn-icon" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="contract-modal-tabs">
      <button class="contract-modal-tab active" id="tab-basic-btn" onclick="switchModalTab('basic')">기본정보</button>
      <button class="contract-modal-tab" id="tab-hist-btn" onclick="switchModalTab('hist')">계약 히스토리</button>
    </div>
    <div class="contract-modal-body" id="tab-basic">
      <form id="contract-form" onsubmit="return false;">
        <div class="contract-form-grid">
          <div class="contract-form-group"><label>사업장명 *</label><input type="text" id="f-name"></div>
          <div class="contract-form-group"><label>소재지</label><input type="text" id="f-addr"></div>
          <div class="contract-form-group full">
            <label>담당 영양사 <button type="button" class="btn btn-ghost btn-sm" onclick="addNutriRow()" style="margin-left:8px;"><i class="ti ti-plus"></i> 추가</button></label>
            <div id="nutritionist-rows">
              <div class="nutri-row" style="display:flex;gap:8px;align-items:center;margin-top:8px;">
                <input type="text" placeholder="이름 · 직책" class="nutri-name" style="flex:1;padding:8px 10px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);font-size:13px;">
                <input type="text" placeholder="연락처" class="nutri-phone" oninput="formatPhone(this)" style="flex:1;padding:8px 10px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);font-size:13px;">
                <button type="button" class="btn btn-danger btn-sm" onclick="removeNutriRow(this)"><i class="ti ti-trash"></i></button>
              </div>
            </div>
          </div>
          <div class="contract-form-group full">
            <label>담당자 <button type="button" class="btn btn-ghost btn-sm" onclick="addContactRow()" style="margin-left:8px;"><i class="ti ti-plus"></i> 추가</button></label>
            <div id="contact-rows" style="margin-top:8px;">
              <div class="contact-row">
                <input type="text" placeholder="이름 · 직책" class="contact-name">
                <input type="text" placeholder="연락처" class="contact-phone" oninput="formatPhone(this)">
                <input type="text" placeholder="대표번호" class="contact-tel" oninput="formatPhone(this)">
                <button type="button" class="btn btn-danger btn-sm" onclick="removeContactRow(this)"><i class="ti ti-trash"></i></button>
              </div>
            </div>
          </div>
          <div class="contract-form-group"><label>팀</label>
            <select id="f-team"><option value="1">1팀 (박주형)</option><option value="2">2팀 (김재희)</option></select>
          </div>
          <div class="contract-form-group"><label>책임</label>
            <select id="f-resp">
              <option value="">선택...</option>
              <option>손도란 대리</option><option>이소영 주임</option>
              <option>김상준 주임</option><option>견병록 매니저</option>
            </select>
          </div>
          <div class="contract-form-group"><label>계약 시작일</label><input type="date" id="f-startDate"></div>
          <div class="contract-form-group"><label>계약 종료일 *</label><input type="date" id="f-endDate"></div>
          <div class="contract-form-group"><label>계약단가 (원)</label><input type="number" id="f-price"></div>
          <div class="contract-form-group"><label>단가 구분</label>
            <select id="f-priceType">
              <option value="per-meal">식수 단가 (원/식)</option>
              <option value="management">관리비제</option>
              <option value="fixed">월 고정금액</option>
            </select>
          </div>
          <div class="contract-form-group"><label>월평균식수</label><input type="number" id="f-avgMeals"></div>
          <div class="contract-form-group full">
            <label>운영끼니</label>
            <div class="meal-wrap" style="margin-top:8px;">
              <div class="meal-section">
                <div class="meal-section-header"><span style="font-size:12px;font-weight:600;color:var(--gray-600);">평일</span></div>
                <div class="meal-chips-row">
                  <label class="meal-chip-label"><input type="checkbox" class="meal-cb" data-day="weekday" value="조" onchange="updateChip(this)"> 조식</label>
                  <label class="meal-chip-label"><input type="checkbox" class="meal-cb" data-day="weekday" value="중" onchange="updateChip(this)"> 중식</label>
                  <label class="meal-chip-label"><input type="checkbox" class="meal-cb" data-day="weekday" value="석" onchange="updateChip(this)"> 석식</label>
                  <label class="meal-chip-label"><input type="checkbox" class="meal-cb" data-day="weekday" value="야" onchange="updateChip(this)"> 야식</label>
                </div>
              </div>
              <div class="meal-section">
                <div class="meal-section-header">
                  <label class="meal-chip-label" style="border:none;padding:0;background:none;font-weight:600;font-size:12px;color:var(--gray-600);gap:6px;">
                    <input type="checkbox" id="meal-sat" onchange="toggleWeekend('sat')"> 토요일 운영
                  </label>
                </div>
                <div class="meal-chips-row" id="meal-sat-sub" style="display:none;">
                  <label class="meal-chip-label"><input type="checkbox" class="meal-cb" data-day="sat" value="조" onchange="updateChip(this)"> 조식</label>
                  <label class="meal-chip-label"><input type="checkbox" class="meal-cb" data-day="sat" value="중" onchange="updateChip(this)"> 중식</label>
                  <label class="meal-chip-label"><input type="checkbox" class="meal-cb" data-day="sat" value="석" onchange="updateChip(this)"> 석식</label>
                  <label class="meal-chip-label"><input type="checkbox" class="meal-cb" data-day="sat" value="야" onchange="updateChip(this)"> 야식</label>
                </div>
              </div>
              <div class="meal-section">
                <div class="meal-section-header">
                  <label class="meal-chip-label" style="border:none;padding:0;background:none;font-weight:600;font-size:12px;color:var(--gray-600);gap:6px;">
                    <input type="checkbox" id="meal-sun" onchange="toggleWeekend('sun')"> 일요일 운영
                  </label>
                </div>
                <div class="meal-chips-row" id="meal-sun-sub" style="display:none;">
                  <label class="meal-chip-label"><input type="checkbox" class="meal-cb" data-day="sun" value="조" onchange="updateChip(this)"> 조식</label>
                  <label class="meal-chip-label"><input type="checkbox" class="meal-cb" data-day="sun" value="중" onchange="updateChip(this)"> 중식</label>
                  <label class="meal-chip-label"><input type="checkbox" class="meal-cb" data-day="sun" value="석" onchange="updateChip(this)"> 석식</label>
                  <label class="meal-chip-label"><input type="checkbox" class="meal-cb" data-day="sun" value="야" onchange="updateChip(this)"> 야식</label>
                </div>
              </div>
            </div>
          </div>
          <div class="contract-form-group full"><label>특이사항</label><textarea id="f-note" style="margin-top:4px;"></textarea></div>
        </div>
      </form>
    </div>
    <div class="contract-modal-body" id="tab-hist" style="display:none;">
      <div style="display:flex;justify-content:flex-end;margin-bottom:12px;">
        <button class="btn btn-primary btn-sm" onclick="addHistRow()"><i class="ti ti-plus"></i> 이력 추가</button>
      </div>
      <div id="hist-list"></div>
    </div>
    <div class="contract-modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">닫기</button>
      <button class="btn btn-primary" id="modal-save-btn" onclick="saveContract()"><i class="ti ti-check"></i> 저장</button>
    </div>
  </div>
</div>

<script type="module" src="./src/js/app.js"></script>
</body>
</html>
