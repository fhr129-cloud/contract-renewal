<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>재계약 관리 시스템</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f5f5f3; color: #1a1a18; min-height: 100vh; }

    #home-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
    .home-logo { font-size: 32px; font-weight: 700; color: #185FA5; margin-bottom: 8px; }
    .home-sub { font-size: 14px; color: #888; margin-bottom: 48px; }
    .home-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 480px; }
    .home-btn { background: #fff; border: 0.5px solid #e8e8e4; border-radius: 16px; padding: 28px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; cursor: pointer; transition: box-shadow 0.15s, transform 0.15s; text-align: center; }
    .home-btn:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); transform: translateY(-2px); }
    .home-btn i { font-size: 32px; }
    .home-btn .btn-label { font-size: 14px; font-weight: 600; color: #1a1a18; }
    .home-btn .btn-desc { font-size: 12px; color: #888; }
    .home-btn.blue i { color: #185FA5; }
    .home-btn.green i { color: #3B6D11; }
    .home-btn.amber i { color: #854F0B; }
    .home-btn.red i { color: #A32D2D; }

    #app { display: none; flex-direction: column; min-height: 100vh; }
    .top-bar { height: 52px; background: #fff; border-bottom: 0.5px solid #e8e8e4; display: flex; align-items: center; padding: 0 20px; gap: 12px; position: sticky; top: 0; z-index: 10; }
    .back-btn { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #185FA5; background: none; border: none; cursor: pointer; padding: 0; }
    .top-bar h2 { font-size: 15px; font-weight: 600; flex: 1; }
    .top-actions { display: flex; gap: 8px; }
    .page-body { padding: 20px; }

    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 0.5px solid #ccc; background: #fff; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .btn:hover { background: #f5f5f3; }
    .btn.primary { background: #185FA5; color: #fff; border-color: #185FA5; }
    .btn.primary:hover { background: #0C447C; }
    .btn.danger { background: #FCEBEB; color: #A32D2D; border-color: #F7C1C1; }
    .btn.sm { padding: 5px 10px; font-size: 12px; }

    .badge { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 99px; border: 0.5px solid transparent; white-space: nowrap; }
    .badge.urgent { background: #FCEBEB; color: #A32D2D; border-color: #F7C1C1; }
    .badge.near { background: #FAEEDA; color: #854F0B; border-color: #FAC775; }
    .badge.ok { background: #EAF3DE; color: #3B6D11; border-color: #C0DD97; }
    .badge.auto { background: #E6F1FB; color: #185FA5; border-color: #B5D4F4; }

    .card { background: #fff; border: 0.5px solid #e8e8e4; border-radius: 12px; overflow: hidden; margin-bottom: 12px; }
    .card-header { padding: 14px 16px; border-bottom: 0.5px solid #e8e8e4; display: flex; align-items: center; justify-content: space-between; }
    .card-title { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
    .card-body { padding: 14px 16px; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; font-weight: 500; font-size: 12px; color: #888; padding: 9px 10px; border-bottom: 0.5px solid #e8e8e4; white-space: nowrap; }
    td { padding: 10px; border-bottom: 0.5px solid #f0f0ec; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #fafaf8; cursor: pointer; }

    .toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
    .toolbar input, .toolbar select { padding: 8px 12px; border: 0.5px solid #ccc; border-radius: 8px; font-size: 13px; background: #fff; }
    .toolbar input { min-width: 180px; }

    /* 탭 */
    .tab-bar { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 0.5px solid #e8e8e4; padding-bottom: 0; flex-wrap: wrap; }
    .tab-btn { padding: 8px 16px; font-size: 13px; font-weight: 500; color: #888; background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; transition: color 0.1s; margin-bottom: -1px; }
    .tab-btn:hover { color: #185FA5; }
    .tab-btn.active { color: #185FA5; border-bottom-color: #185FA5; }

    /* 거래처 카드 */
    .biz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
    .biz-card { background: #fff; border: 0.5px solid #e8e8e4; border-radius: 12px; padding: 16px; }
    .biz-name { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .biz-info { font-size: 12px; color: #888; display: flex; flex-direction: column; gap: 4px; }
    .biz-info span { display: flex; align-items: flex-start; gap: 5px; }
    .biz-info i { margin-top: 2px; flex-shrink: 0; }

    /* 책임자 섹션 */
    .resp-section { margin-bottom: 24px; }
    .resp-header { font-size: 14px; font-weight: 600; color: #185FA5; margin-bottom: 10px; padding: 8px 12px; background: #E6F1FB; border-radius: 8px; display: flex; align-items: center; gap: 6px; }

    /* 지역 섹션 */
    .region-section { margin-bottom: 20px; }
    .region-header { font-size: 13px; font-weight: 600; color: #666; margin-bottom: 8px; padding: 6px 10px; background: #f5f5f3; border-radius: 6px; border-left: 3px solid #185FA5; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 12px; width: 560px; max-width: 95vw; max-height: 90vh; overflow-y: auto; }
    .modal-header { padding: 16px 20px; border-bottom: 0.5px solid #e8e8e4; display: flex; align-items: center; justify-content: space-between; }
    .modal-header h3 { font-size: 15px; font-weight: 600; }
    .modal-body { padding: 20px; }
    .modal-footer { padding: 14px 20px; border-top: 0.5px solid #e8e8e4; display: flex; justify-content: flex-end; gap: 8px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label { font-size: 12px; color: #666; font-weight: 500; }
    .form-group input, .form-group select, .form-group textarea { padding: 8px 12px; border: 0.5px solid #ccc; border-radius: 8px; font-size: 13px; width: 100%; }
    .form-group textarea { resize: vertical; min-height: 64px; }

    .dday-wrap { display: flex; align-items: center; gap: 7px; }
    .dday-bar { height: 4px; border-radius: 2px; min-width: 4px; }

    .tl-month-group { margin-bottom: 16px; }
    .tl-month-label { font-size: 12px; font-weight: 500; color: #888; margin-bottom: 7px; display: flex; align-items: center; gap: 6px; }
    .tl-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .tl-chip { font-size: 12px; padding: 4px 10px; border-radius: 8px; border: 0.5px solid transparent; }
    .tl-chip.urgent { background: #FCEBEB; color: #A32D2D; border-color: #F7C1C1; }
    .tl-chip.near { background: #FAEEDA; color: #854F0B; border-color: #FAC775; }
    .tl-chip.ok { background: #EAF3DE; color: #3B6D11; border-color: #C0DD97; }
    .tl-chip.auto { background: #E6F1FB; color: #185FA5; border-color: #B5D4F4; }

    .hist-record { padding: 10px 0; border-bottom: 0.5px solid #f0f0ec; display: flex; justify-content: space-between; gap: 12px; }
    .hist-record:last-child { border-bottom: none; }
    .hist-round { font-size: 11px; color: #888; background: #f5f5f3; padding: 2px 7px; border-radius: 99px; }

    .toast { position: fixed; bottom: 24px; right: 24px; background: #1a1a18; color: #fff; padding: 12px 18px; border-radius: 8px; font-size: 13px; z-index: 999; animation: fadeUp 0.2s ease; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .empty-state { text-align: center; padding: 40px; color: #aaa; font-size: 13px; }
    .empty-state i { font-size: 32px; display: block; margin-bottom: 10px; }
    .count-badge { font-size: 11px; background: #f0f0ec; color: #666; padding: 2px 7px; border-radius: 99px; }
    .text-muted { color: #888; }
    .text-sm { font-size: 12px; }
    .mt-1 { margin-top: 6px; }
  </style>
</head>
<body>

<!-- 홈 화면 -->
<div id="home-screen">
  <div class="home-logo">📋 재계약 관리</div>
  <div class="home-sub">온정F&amp;B 사업장 재계약 현황 관리 시스템</div>
  <div class="home-menu">
    <div class="home-btn blue" onclick="goPage('businesses')">
      <i class="ti ti-building"></i>
      <div class="btn-label">거래처 정보</div>
      <div class="btn-desc">팀별 · 지역별 · 책임별</div>
    </div>
    <div class="home-btn green" onclick="goPage('contracts')">
      <i class="ti ti-file-text"></i>
      <div class="btn-label">현재 계약현황</div>
      <div class="btn-desc">D-day 및 상태 확인</div>
    </div>
    <div class="home-btn amber" onclick="goPage('history')">
      <i class="ti ti-history"></i>
      <div class="btn-label">계약 히스토리</div>
      <div class="btn-desc">계약 이력 조회</div>
    </div>
    <div class="home-btn red" onclick="goPage('admin')">
      <i class="ti ti-settings"></i>
      <div class="btn-label">관리자 수정</div>
      <div class="btn-desc">계약 추가 · 수정 · 삭제</div>
    </div>
  </div>
</div>

<!-- 앱 화면 -->
<div id="app">
  <div class="top-bar">
    <button class="back-btn" onclick="goHome()"><i class="ti ti-arrow-left"></i> 홈</button>
    <h2 id="page-title"></h2>
    <div class="top-actions" id="top-actions"></div>
  </div>

  <!-- 거래처 정보 -->
  <div id="page-businesses" class="page-body" style="display:none;">
    <div class="toolbar">
      <input type="text" id="biz-search" placeholder="사업장명 검색..." oninput="renderBizTab()">
    </div>
    <div class="tab-bar">
      <button class="tab-btn active" onclick="setBizTab('all')">전체</button>
      <button class="tab-btn" onclick="setBizTab('team1')">1팀 (박주형)</button>
      <button class="tab-btn" onclick="setBizTab('team2')">2팀 (김재희)</button>
      <button class="tab-btn" onclick="setBizTab('region')">소재지별</button>
      <button class="tab-btn" onclick="setBizTab('resp')">책임별</button>
    </div>
    <div id="biz-content"></div>
  </div>

  <!-- 현재 계약현황 -->
  <div id="page-contracts" class="page-body" style="display:none;">
    <div class="toolbar">
      <input type="text" id="search-input" placeholder="사업장명 검색..." oninput="renderContractTable()">
      <select id="filter-status" onchange="renderContractTable()">
        <option value="">전체 상태</option>
        <option value="auto">자동연장</option>
        <option value="urgent">긴급</option>
        <option value="near">임박</option>
        <option value="ok">여유</option>
      </select>
      <span id="count-label" class="count-badge"></span>
    </div>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>상태</th><th>사업장</th><th>종료일</th><th>D-day</th><th>자동연장</th><th>단가</th><th>비고</th>
          </tr></thead>
          <tbody id="contract-tbody"></tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title"><i class="ti ti-calendar"></i> 월별 타임라인</span></div>
      <div class="card-body"><div id="timeline-content"></div></div>
    </div>
  </div>

  <!-- 계약 히스토리 -->
  <div id="page-history" class="page-body" style="display:none;">
    <div class="toolbar">
      <input type="text" id="hist-search" placeholder="사업장 검색..." oninput="renderHistory()">
    </div>
    <div id="history-content"></div>
  </div>

  <!-- 관리자 수정 -->
  <div id="page-admin" class="page-body" style="display:none;">
    <div class="toolbar">
      <input type="text" id="admin-search" placeholder="사업장명 검색..." oninput="renderAdmin()">
      <span id="admin-count" class="count-badge"></span>
    </div>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>상태</th><th>사업장</th><th>종료일</th><th>D-day</th><th>단가</th><th style="width:80px;"></th>
          </tr></thead>
          <tbody id="admin-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 계약 모달 -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">계약 추가</h3>
      <button class="btn sm" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body">
      <form id="contract-form" onsubmit="return false;">
        <div class="form-grid">
          <div class="form-group"><label>사업장명 *</label><input type="text" id="f-name"></div>
          <div class="form-group"><label>소재지</label><input type="text" id="f-location"></div>
          <div class="form-group"><label>담당자 이름</label><input type="text" id="f-contactName"></div>
          <div class="form-group"><label>담당자 연락처</label><input type="tel" id="f-contactPhone"></div>
          <div class="form-group"><label>대표번호</label><input type="text" id="f-tel"></div>
          <div class="form-group"><label>자동연장 조건</label>
            <select id="f-autoRenew"><option value="false">없음</option><option value="true">자동연장 있음</option></select>
          </div>
          <div class="form-group"><label>계약 시작일</label><input type="date" id="f-startDate"></div>
          <div class="form-group"><label>계약 종료일 *</label><input type="date" id="f-endDate"></div>
          <div class="form-group"><label>계약단가 (원)</label><input type="number" id="f-price"></div>
          <div class="form-group"><label>단가 구분</label>
            <select id="f-priceType">
              <option value="per-meal">식수 단가 (원/식)</option>
              <option value="management">관리비제</option>
              <option value="fixed">월 고정금액</option>
            </select>
          </div>
          <div class="form-group full"><label>비고</label><textarea id="f-note"></textarea></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn primary" onclick="saveContract()"><i class="ti ti-check"></i> 저장</button>
    </div>
  </div>
</div>

<script type="module" src="./src/js/app.js"></script>
</body>
</html>
