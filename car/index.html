<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>차량 예약</title>
<link rel="icon" href="../icon.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#185FA5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="차량예약">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{font-family:'Noto Sans KR',sans-serif;background:#F4F3EF;color:#1a1a18;font-size:14px;min-height:100vh;}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left;}
input{font-family:inherit;font-size:15px;}
#app{max-width:560px;margin:0 auto;}

/* 상단 */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));background:rgba(244,243,239,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:.5px solid #E2E0DA;}
.back{font-size:13px;color:#185FA5;text-decoration:none;padding:6px 4px;white-space:nowrap;}
.ttl{flex:1;min-width:0;}
.ttl.c{text-align:center;}
.t1{font-size:16px;font-weight:700;}
.t2{font-size:11px;color:#8A877F;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#55524B;}
.icon:active{background:#E8E6E0;}

.pad{padding:14px 14px 0;}
.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;color:#3D3B36;margin:4px 2px 8px;}
.sec span{font-weight:400;font-size:11px;color:#8A877F;}
.sec.sp{margin-top:20px;}
.card{background:#fff;border-radius:14px;border:.5px solid #E2E0DA;overflow:hidden;}

/* 현재 상태 */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat{display:flex;flex-direction:column;gap:3px;background:#fff;border:.5px solid #E2E0DA;border-radius:14px;padding:13px 13px 12px;min-height:110px;}
.stat .row{display:flex;align-items:center;gap:6px;font-size:13px;}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.dot.lg{width:12px;height:12px;}
.plate{font-size:11px;color:#8A877F;}
.state{font-size:16px;font-weight:700;margin-top:auto;}
.stat.free .state{color:#3B6D11;}
.stat.busy .state{color:#A32D2D;}
.stat.busy{background:#FDF6F5;}
.sub{font-size:11px;color:#6E6B64;line-height:1.4;}
.stat:active{transform:scale(.98);}
.notice{margin-top:10px;font-size:12px;color:#55524B;background:#ECEAE4;border-radius:10px;padding:9px 12px;line-height:1.5;}

/* 주간 타임라인 */
.wk{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:#3D3B36 !important;}
.nav{width:30px;height:30px;border-radius:8px;font-size:18px;line-height:1;display:inline-flex;align-items:center;justify-content:center;color:#55524B;}
.nav:active{background:#E8E6E0;}
.legend{display:flex;align-items:center;gap:4px;font-size:11px;color:#6E6B64 !important;font-weight:400;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:6px;}
.legend i.hatch{background:repeating-linear-gradient(135deg,#9A968E 0 3px,#D9D6CF 3px 6px);}
.legend.m{flex-wrap:wrap;margin:8px 2px 0;}
.legend.m span{width:100%;margin-top:3px;color:#9A968E;font-size:10px;}
.tl{padding:2px 0 0;}
.tl-axis{display:grid;grid-template-columns:44px 1fr;padding:6px 12px 4px 0;}
.tl-axis>div{position:relative;height:14px;}
.tl-axis>div span{position:absolute;transform:translateX(-50%);font-size:10px;color:#9A968E;white-space:nowrap;}
.tl-row{display:grid;grid-template-columns:44px 1fr;align-items:stretch;padding:0 12px 0 0;border-top:.5px solid #F0EEE9;cursor:pointer;}
.tl-row.today{background:#F3F8FD;box-shadow:inset 3px 0 0 #185FA5;}
.tl-day{display:flex;align-items:center;justify-content:center;gap:3px;font-size:12px;color:#3D3B36;}
.tl-day b{font-weight:500;color:#8A877F;font-size:11px;}
.tl-day.red,.tl-day.red b{color:#B54040;}
.tl-row.today .tl-day span{color:#185FA5;font-weight:700;}
.tl-track{position:relative;height:46px;}
.tl-line{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed #E8E6E0;pointer-events:none;}
.bar{position:absolute;height:16px;border-radius:5px;color:#fff;font-size:10px;font-weight:600;padding:0 5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:16px;text-align:left;}
.bar.maint{background:repeating-linear-gradient(135deg,#9A968E 0 3px,#B9B5AD 3px 6px);}
.bar.mine{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.9);}

/* 내 예약 */
.mine-row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-top:.5px solid #F0EEE9;}
.mine-row:first-child{border-top:none;}
.md{display:flex;flex-direction:column;align-items:center;width:30px;line-height:1.15;}
.md small{font-size:10px;color:#8A877F;}
.md b{font-size:18px;}
.mt{flex:1;display:flex;flex-direction:column;min-width:0;}
.mt b{font-size:13px;}
.mt small{font-size:11px;color:#6E6B64;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chev{color:#BDBAB2;font-size:18px;}

.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;display:flex;align-items:center;gap:6px;background:#185FA5;color:#fff;font-weight:600;font-size:15px;padding:14px 20px;border-radius:99px;box-shadow:0 6px 18px rgba(24,95,165,.35);}
.fab:active{transform:scale(.97);}

/* 월간 */
.mhead{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px;font-size:15px;}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.mgrid.dow span{text-align:center;font-size:11px;color:#8A877F;padding:4px 0;}
.mgrid .red{color:#B54040;}
.mcell{background:#fff;border-radius:9px;border:.5px solid #E8E6E0;min-height:54px;padding:5px 4px 6px;display:flex;flex-direction:column;gap:3px;}
.mcell.past{opacity:.55;}
.mcell.today{border-color:#185FA5;}
.mcell.sel{background:#E6F1FB;border-color:#185FA5;box-shadow:0 0 0 1px #185FA5 inset;}
.mn{font-size:12px;font-weight:500;margin-bottom:auto;padding-left:2px;}
.mcell.today .mn{color:#185FA5;font-weight:700;}
.mb{display:block;height:5px;border-radius:3px;}
.drow{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border-top:.5px solid #F0EEE9;}
.drow:first-child{border-top:none;}
.drow>i{width:4px;align-self:stretch;border-radius:2px;flex-shrink:0;}
.drow>span{flex:1;display:flex;flex-direction:column;min-width:0;}
.drow b{font-size:13px;}
.drow b.ok{color:#3B6D11;font-weight:500;}
.drow small{font-size:11px;color:#6E6B64;}
.mini{font-size:12px;font-weight:600;color:#185FA5;background:#E6F1FB;padding:6px 12px;border-radius:99px;}

/* 상세 창 */
.ov{display:none;position:fixed;inset:0;z-index:50;background:rgba(20,20,18,.38);align-items:flex-end;justify-content:center;}
.ov.on{display:flex;}
.sheet{width:100%;max-width:560px;background:#fff;border-radius:18px 18px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease;}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grip{width:38px;height:4px;border-radius:2px;background:#DDDAD3;margin:0 auto 12px;}
.sh-h{display:flex;align-items:center;gap:8px;font-size:16px;margin-bottom:12px;}
.tag{font-size:11px;font-weight:600;background:#ECEAE4;color:#55524B;padding:2px 8px;border-radius:99px;}
.x{margin-left:auto;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#F2F1ED;}
dl{display:grid;grid-template-columns:64px 1fr;gap:9px 10px;font-size:14px;margin-bottom:16px;}
dt{color:#8A877F;font-size:12px;padding-top:2px;}
dd{line-height:1.45;word-break:keep-all;}
.warn{font-size:12px;color:#8A4B08;background:#FBEBD6;border-radius:9px;padding:8px 11px;margin-bottom:10px;}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.b{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px;border-radius:12px;font-weight:600;font-size:15px;text-decoration:none;text-align:center;}
.b.ghost{background:#F2F1ED;color:#1a1a18;}
.b.danger{background:#FCEBEB;color:#A32D2D;}
.b.call{background:#EAF3DE;color:#3B6D11;width:100%;flex-wrap:wrap;}
.b.call small{font-weight:400;font-size:12px;opacity:.8;}
.b.primary{background:#185FA5;color:#fff;width:100%;}
.b.primary:disabled{background:#B9C8D8;cursor:default;}
.hint{font-size:11px;color:#9A968E;margin-top:8px;text-align:center;line-height:1.5;}

/* 예약 입력 */
.full{display:none;position:fixed;inset:0;z-index:40;background:#F4F3EF;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.full.on{display:block;}
.full>.top,.full>main,.full>.foot{max-width:560px;margin-left:auto;margin-right:auto;}
.form .lbl{display:block;font-size:12px;font-weight:600;color:#55524B;margin:18px 2px 7px;}
.form .lbl span{font-weight:400;color:#9A968E;margin-left:4px;}
.form .daterow+.lbl{margin-top:6px;font-weight:400;color:#185FA5;}
.form input[type=text],.form input[type=date],.form input[type=time]{width:100%;padding:12px;border:.5px solid #D4D1CA;border-radius:11px;background:#fff;color:#1a1a18;min-height:46px;}
.form input:focus{outline:2px solid #185FA5;outline-offset:-1px;}
.daterow{display:flex;gap:6px;align-items:center;}
.daterow input{flex:1;min-width:0;}
.chip{padding:9px 13px;border-radius:99px;background:#fff;border:.5px solid #D4D1CA;font-size:13px;white-space:nowrap;}
.chip.on{background:#185FA5;border-color:#185FA5;color:#fff;font-weight:600;}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.slot{display:flex;flex-direction:column;align-items:center;gap:1px;padding:11px 4px;background:#fff;border:.5px solid #D4D1CA;border-radius:12px;}
.slot b{font-size:15px;}
.slot small{font-size:11px;color:#8A877F;}
.slot.on{border-color:#185FA5;background:#E6F1FB;box-shadow:0 0 0 1px #185FA5 inset;}
.slot.on small{color:#185FA5;}
.times{display:flex;align-items:flex-end;gap:8px;margin-top:10px;}
.times label{flex:1;display:flex;flex-direction:column;gap:4px;font-size:11px;color:#8A877F;}
.times>span{padding-bottom:13px;color:#9A968E;}
.err{font-size:12px;color:#A32D2D;margin:8px 2px 0;}
.carpick{display:flex;align-items:center;gap:11px;width:100%;padding:13px 14px;background:#fff;border:.5px solid #D4D1CA;border-radius:13px;margin-bottom:8px;}
.carpick.on{border-color:#185FA5;box-shadow:0 0 0 1px #185FA5 inset;background:#F3F8FD;}
.carpick.no{background:#F2F1ED;cursor:not-allowed;}
.carpick.no b{color:#9A968E;}
.cp{flex:1;display:flex;flex-direction:column;min-width:0;}
.cp b{font-size:14px;}
.cp small{font-size:11px;color:#3B6D11;}
.cp small.bad{color:#A32D2D;}
.tagr{font-size:11px;font-weight:600;color:#185FA5;white-space:nowrap;}
.carpick.no .tagr{color:#9A968E;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.adm{margin-top:22px;border:1px dashed #C9C5BC;border-radius:13px;padding:12px 14px;background:#FAF9F6;}
.admt{font-size:10px;font-weight:600;color:#8A877F;letter-spacing:.02em;margin-bottom:6px;}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;}
.chk input{width:20px;height:20px;accent-color:#185FA5;}
.adm .hint{text-align:left;}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#fff;border-top:.5px solid #E2E0DA;padding:10px 14px calc(12px + env(safe-area-inset-bottom));}
.sum{font-size:12px;color:#55524B;text-align:center;margin-bottom:8px;min-height:16px;line-height:1.4;}

/* 단계형 입력 (운영지원 등록과 같은 흐름) */
.step{animation:stepIn .25s ease;}
@keyframes stepIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.two .lbl{display:flex;align-items:center;min-height:22px;white-space:nowrap;}
.lnk{font-size:11px;color:#185FA5;font-weight:500;margin-left:6px;padding:2px 0;}
.lbl-sub{font-size:12px;color:#185FA5;margin:6px 2px 0;}
.form textarea{width:100%;min-height:76px;padding:12px;border:.5px solid #D4D1CA;border-radius:11px;background:#fff;font-family:inherit;font-size:15px;resize:vertical;}
.form .adm.chk{display:flex;align-items:center;gap:8px;margin:4px 0 0;padding:10px 12px;border:1px dashed #C9C5BC;border-radius:11px;background:#FAF9F6;font-size:13px;}
.form .adm.chk small{margin-left:auto;font-size:10px;color:#9A968E;}
.sug-i.direct span{color:#185FA5;}

/* 행선지 추천 */
.dest{position:relative;}
.dest input{padding-right:42px !important;}
.dest-x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#8A877F;}
.ss-dropdown{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:5;background:#fff;border:.5px solid #ccc;border-radius:10px;max-height:300px;overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:0 6px 20px rgba(0,0,0,.12);}
.ss-dropdown.open{display:block;}
.ss-option{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:11px 14px;font-size:14px;border-bottom:.5px solid #F2F1ED;}
.ss-option:last-child{border-bottom:none;}
.ss-option:active,.ss-option:hover{background:#F0F0EE;}
.ss-option span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ss-option small{font-size:10px;color:#9A968E;flex-shrink:0;}
.ss-option.direct span{color:#185FA5;font-weight:500;}
.ss-none{padding:11px 14px;font-size:13px;color:#aaa;}

/* 토스트 */
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-20px);z-index:100;background:#1a1a18;color:#fff;font-size:13px;padding:11px 16px;border-radius:12px;max-width:calc(100% - 32px);width:max-content;line-height:1.45;opacity:0;pointer-events:none;transition:all .25s;}
#toast.on{opacity:1;transform:translate(-50%,0);}

/* 로그인 */
#login{display:none;position:fixed;inset:0;z-index:90;background:#F4F3EF;align-items:center;justify-content:center;padding:20px;}
.lg-box{width:100%;max-width:340px;background:#fff;border-radius:18px;padding:28px 22px;border:.5px solid #E2E0DA;}
.lg-logo{font-size:22px;font-weight:700;color:#185FA5;}
.lg-sub{font-size:12px;color:#8A877F;margin:2px 0 22px;}
.lg-box label{display:block;font-size:12px;color:#55524B;font-weight:500;margin-bottom:5px;}
.lg-box input{width:100%;padding:12px;border:.5px solid #D4D1CA;border-radius:10px;margin-bottom:12px;}
.lg-btn{display:block;width:100%;padding:13px;border-radius:11px;background:#185FA5;color:#fff;font-weight:600;font-size:15px;text-align:center;margin-top:4px;}
.lg-btn.ghost{background:#F2F1ED;color:#1a1a18;margin-top:10px;font-size:13px;padding:10px;}
#lg-hello{font-size:13px;color:#185FA5;margin-bottom:14px;line-height:1.5;}
#lg-err{display:none;font-size:12px;color:#A32D2D;background:#FCEBEB;padding:9px 12px;border-radius:9px;margin-top:12px;line-height:1.5;}

#splash{position:fixed;inset:0;z-index:99;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
#splash b{font-size:22px;color:#185FA5;}
#splash span{font-size:12px;color:#9A968E;}
</style>
</head>
<body>

<div id="splash"><b>차량 예약</b><span>불러오는 중…</span></div>

<div id="login">
  <div class="lg-box">
    <div class="lg-logo">차량 예약</div>
    <div class="lg-sub">온정F&amp;B · FS 앱과 같은 번호·비밀번호로 로그인</div>
    <div id="lg-phone-step">
      <label for="lg-phone">휴대폰 번호</label>
      <input type="tel" id="lg-phone" placeholder="01012345678" maxlength="13" inputmode="numeric" onkeydown="if(event.key==='Enter')lgPhone()">
      <button class="lg-btn" onclick="lgPhone()">다음</button>
    </div>
    <div id="lg-pw-step" style="display:none">
      <div id="lg-hello"></div>
      <label for="lg-pw">비밀번호</label>
      <input type="password" id="lg-pw" placeholder="6자 이상" onkeydown="if(event.key==='Enter')lgSubmit()">
      <div id="lg-pw2-wrap" style="display:none">
        <label for="lg-pw2">비밀번호 확인</label>
        <input type="password" id="lg-pw2" placeholder="한 번 더 입력" onkeydown="if(event.key==='Enter')lgSubmit()">
      </div>
      <button class="lg-btn" id="lg-submit" onclick="lgSubmit()">로그인</button>
      <button class="lg-btn ghost" onclick="lgBack()">번호 다시 입력</button>
    </div>
    <div id="lg-err"></div>
  </div>
</div>

<div id="app"></div>
<div id="sheet" class="ov"></div>
<div id="form" class="full"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module" src="./car.js?v=20261012e"></script>
</body>
</html>
