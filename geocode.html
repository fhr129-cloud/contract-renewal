var results = {};
var geocoder;
var finalCode = '';

function startGeocode() {
  geocoder = new kakao.maps.services.Geocoder();
  var idx = 0;
  var total = addresses.length;
  var log = '';
  document.getElementById('result').textContent = '변환 시작...\n';
  document.getElementById('copy-btn').style.display = 'none';

  function next() {
    if(idx >= total) {
      finish(log);
      return;
    }
    var name = addresses[idx][0];
    var addr = addresses[idx][1];
    document.getElementById('status').textContent = '(' + (idx+1) + '/' + total + ') ' + name;
    document.getElementById('prog').value = idx+1;

    geocoder.addressSearch(addr, function(res, status) {
      if(status === kakao.maps.services.Status.OK) {
        var lat = parseFloat(res[0].y).toFixed(4);
        var lng = parseFloat(res[0].x).toFixed(4);
        results[name] = {lat:lat, lng:lng};
        log += '✓ ' + name + ': ' + lat + ', ' + lng + '\n';
      } else {
        log += '✗ ' + name + ': 실패\n';
      }
      document.getElementById('result').textContent = log;
      document.getElementById('result').scrollTop = 9999;
      idx++;
      setTimeout(next, 120);
    });
  }
  next();
}

function finish(log) {
  document.getElementById('status').textContent = '✅ 완료! 아래 코드를 복사해서 app.js에 붙여넣으세요';
  finalCode = '\nvar COORDS = {\n';
  for(var name in results) {
    finalCode += "  '" + name + "':{lat:" + results[name].lat + ",lng:" + results[name].lng + "},\n";
  }
  finalCode += '};';
  document.getElementById('result').textContent = log + finalCode;
  document.getElementById('copy-btn').style.display = 'inline-block';
}

function copyResult() {
  navigator.clipboard.writeText(finalCode).then(function(){
    alert('복사되었습니다! app.js의 var COORDS = { ... } 부분을 이걸로 교체하세요 😊');
  });
}
