<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>좌표 일괄 업데이트</title>
<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=aefff94dbfce9edffe1c0e100dc4de55&libraries=services"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
body{font-family:sans-serif;padding:24px;background:#f5f5f5;max-width:900px;margin:0 auto;}
h2{margin-bottom:16px;color:#185FA5;}
#status{font-size:14px;color:#555;margin-bottom:8px;}
progress{width:100%;height:10px;margin-bottom:16px;accent-color:#185FA5;}
button{padding:10px 24px;background:#185FA5;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;margin-bottom:16px;}
button:hover{background:#0C447C;}
#result{background:#1a1a18;color:#a8ff78;padding:16px;border-radius:8px;font-size:12px;font-family:monospace;white-space:pre-wrap;height:400px;overflow-y:auto;}
</style>
</head>
<body>
<h2>📍 Firebase 좌표 일괄 업데이트</h2>
<button onclick="startUpdate()">▶ 업데이트 시작</button>
<div id="status">버튼을 눌러 시작하세요</div>
<progress id="prog" value="0" max="100"></progress>
<div id="result">여기에 결과가 나타납니다...</div>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyDd67rNSC-d2GzZaLAcT2XP8m9c_2K1gzo",
  authDomain: "contract-renewal-e0c6d.firebaseapp.com",
  projectId: "contract-renewal-e0c6d",
  storageBucket: "contract-renewal-e0c6d.firebasestorage.app",
  messagingSenderId: "977225940543",
  appId: "1:977225940543:web:6080359213deca262bc28a"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();
var geocoder;
var log = '';

function addLog(msg) {
  log += msg + '\n';
  document.getElementById('result').textContent = log;
  document.getElementById('result').scrollTop = 9999;
}

async function startUpdate() {
  geocoder = new kakao.maps.services.Geocoder();
  addLog('Firebase에서 계약 데이터 불러오는 중...');

  var snap = await db.collection('contracts').get();
  var docs = snap.docs;
  var total = docs.length;
  document.getElementById('prog').max = total;
  addLog('총 ' + total + '개 사업장 처리 시작\n');

  var done = 0, success = 0, fail = 0;

  for(var i=0; i<docs.length; i++) {
    var doc = docs[i];
    var data = doc.data();
    var name = data.name;
    var addr = data.addr || '';

    document.getElementById('status').textContent = '(' + (i+1) + '/' + total + ') ' + name;
    document.getElementById('prog').value = i+1;

    if(!addr) {
      addLog('✗ ' + name + ': 주소 없음');
      fail++; done++; continue;
    }

    // 이미 좌표 있으면 스킵
    if(data.lat && data.lng) {
      addLog('- ' + name + ': 이미 좌표 있음 (' + data.lat + ', ' + data.lng + ')');
      done++; continue;
    }

    try {
      var result = await new Promise(function(resolve) {
        geocoder.addressSearch(addr, function(res, status) {
          resolve({res:res, status:status});
        });
      });

      if(result.status === kakao.maps.services.Status.OK) {
        var lat = parseFloat(result.res[0].y);
        var lng = parseFloat(result.res[0].x);
        await db.collection('contracts').doc(doc.id).update({lat:lat, lng:lng});
        addLog('✓ ' + name + ': ' + lat.toFixed(4) + ', ' + lng.toFixed(4));
        success++;
      } else {
        addLog('✗ ' + name + ': 주소 변환 실패 (' + addr + ')');
        fail++;
      }
    } catch(e) {
      addLog('✗ ' + name + ': 오류 - ' + e.message);
      fail++;
    }
    done++;
    await new Promise(function(r){ setTimeout(r, 150); });
  }

  addLog('\n✅ 완료! 성공: ' + success + '개 / 실패: ' + fail + '개');
  document.getElementById('status').textContent = '완료!';
}
</script>
</body>
</html>
